name: Hasselblad Stage16 HDR output versus ISP CCM evidence
'on':
  push:
    branches:
      - recovery/awb-rebuild-20261021
    paths:
      - 'hasselblad_native_audit/isp_hdr_stage16/**'
      - '.github/workflows/hb-isp-stage16-hdr-ccm.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-x2d-hdr:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only parser dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'cryptography>=42,<47' 'brotli>=1.1,<2' 'dissect.extfs>=3,<4' 'pyelftools>=0.31,<1' 'capstone>=5,<6'
      - name: Verify source-only policy
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/isp_hdr_stage16/inspect_hdr_ccm.py --self-test
          test -z "$(git diff --name-only d6fbc6f6891dd856a7f9bbaa2dcecab7c97d14e1 HEAD -- HasselbladPhoton/app hasselblad_native_audit/isp_research_stage14 hasselblad_native_audit/photographic_path hasselblad_native_audit/main_colour_20261019)"
      - name: Download exact original X2D II firmware into transient runner only
        run: |
          set -euo pipefail
          mkdir -p hasselblad_native_audit/firmware
          f=hasselblad_native_audit/firmware/X2DII_100C_v1_3_16_2.cim
          curl --fail --location --retry 2 --retry-delay 4 --connect-timeout 25 --max-time 520 --silent --show-error \
            'https://cdn.hasselblad.com/firmware/X2D_II_100C_Firmware/1.3.16.2/X2DII_100C_v1_3_16_2(1).cim' --output "$f"
          test "$(stat -c %s "$f")" -eq 364814336
          echo '9789d6a9843d388034bc12341ad9a97585c25cb98cf11a0da8b768399b4842f6  '"$f" | sha256sum -c -
      - name: Extract and inspect original firmware without executing vendor code
        run: |
          set -euo pipefail
          python hasselblad_native_audit/extract_official.py > "$RUNNER_TEMP/hb16_private_extraction_log"
          python hasselblad_native_audit/isp_hdr_stage16/inspect_hdr_ccm.py \
            --repo . --firmware-root hasselblad_native_audit/firmware/extracted \
            --output "$RUNNER_TEMP/STAGE16_ORIGINAL_HDR_CCM_RECEIPT.json"
      - name: Validate boundaries and purge original bytes from artifact
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/STAGE16_ORIGINAL_HDR_CCM_RECEIPT.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert data['status']=='PASS_original_firmware_static_inspection'
          assert len(data['original_sha256_pins_verified'])==4
          assert len(data['prior_pinned_saved_still_segment_mapping'])==3
          assert 'post_hdr_calc_3dlut' in data['original_librcam_function_categories']['main_and_post_hdr_functions']
          assert data['classification']['firmware_has_hdr_named_configuration_and_entrypoints']
          for k in ('HDR_requires_exposure_stacking_proven','HDR_uses_no_exposure_stacking_proven_from_static_firmware',
                    'MAIN_CCM_pixel_equation_proven','MAIN_LUT_pixel_sampler_proven',
                    'still_HDR_segment_is_same_as_end_to_end_HNCS_HDR_proven',
                    'vendor_instruction_bytes_exported','vendor_tuning_tables_exported','vendor_binary_executed',
                    'photo_or_gpu_render_modified'):
              assert data['classification'][k] is False,k
          assert len(open(sys.argv[1]).read())<200_000
          print('Stage16: source provenance PASS; photo HDR frame count and CCM pixels explicitly unproved')
          PY
          test "$(git ls-files 'hasselblad_native_audit/firmware/*.cim' | wc -l)" -eq 0
      - name: Upload metadata receipt (no vendor code, LUTs or captures)
        uses: actions/upload-artifact@v4
        with:
          name: Hasselblad-Stage16-HDR-and-CCM-Evidence
          path: ${{ runner.temp }}/STAGE16_ORIGINAL_HDR_CCM_RECEIPT.json
          if-no-files-found: error
          retention-days: 7
