name: Hasselblad Stage17 original MAIN CCM structural and driver audit

'on':
  push:
    branches:
      - recovery/awb-rebuild-20261021
    paths:
      - 'hasselblad_native_audit/isp_ccm_stage17/**'
      - '.github/workflows/hb-isp-stage17-main-ccm.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-ccm-constraints:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout trusted research history
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned analysis packages
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'cryptography>=42,<47' 'brotli>=1.1,<2' 'dissect.extfs>=3,<4' 'capstone>=5,<6' 'pyelftools>=0.31,<1'
      - name: Synthetic signed-Q8 and negative-test guards
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/isp_ccm_stage17/inspect_ccm_constraints.py --self-test
      - name: Fetch original signed camera firmware as transient research data
        shell: bash
        run: |
          set -euo pipefail
          file='hasselblad_native_audit/firmware/X2DII_100C_v1_3_16_2.cim'
          mkdir -p hasselblad_native_audit/firmware
          curl --fail --location --retry 2 --retry-delay 3 --connect-timeout 25 --max-time 560 \
              --silent --show-error \
              'https://cdn.hasselblad.com/firmware/X2D_II_100C_Firmware/1.3.16.2/X2DII_100C_v1_3_16_2(1).cim' \
              --output "$file"
          test "$(stat -c %s "$file")" -eq 364814336
          echo '9789d6a9843d388034bc12341ad9a97585c25cb98cf11a0da8b768399b4842f6  '"$file" | sha256sum -c -
      - name: Unpack and examine exact source in ephemeral workspace
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/extract_official.py > "$RUNNER_TEMP/STAGE17_INTERNAL_EXTRACTION.log"
          python3 hasselblad_native_audit/isp_ccm_stage17/inspect_ccm_constraints.py \
            --firmware-root hasselblad_native_audit/firmware/extracted \
            --output "$RUNNER_TEMP/STAGE17_ORIGINAL_CCM_CONSTRAINTS.json"
      - name: Enforce research/evidence boundaries and inspect structural findings
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet a7f22386b1a7567f91bc808723e821d4a7fab1f9 HEAD -- \
              HasselbladPhoton/app hasselblad_native_audit/main_colour_20261019 \
              hasselblad_native_audit/photographic_path \
              hasselblad_native_audit/isp_research_stage14
          python3 - "$RUNNER_TEMP/STAGE17_ORIGINAL_CCM_CONSTRAINTS.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          assert j['status']=='source_constraints_verified'
          assert j['original_iq_config_sha256']=='2a4fd76e5299937a6607da8454add17e9746347c54adcf5da1360799de634286'
          p=j['physical_table']
          assert p['all_eight_source_profiles_have_equal_16_six_value_rows']
          assert p['both_high_iso_source_banks_identical']
          assert p['source_profiles']==8 and p['stored_regions_per_profile']==16
          assert p['signed_parameters_per_region']==6
          assert len(j['prepared_subsets'])==9
          assert all(s['hiso_weight_0_to_256_identical'] for s in j['prepared_subsets'])
          assert j['CCM_pixel_application_authorized'] is False
          assert j['new_original_main_pixel_ccm_equation_proven'] is False
          assert j['vendor_firmware_executed'] is False
          assert j['vendor_ccm_coefficient_bytes_exported'] is False
          print('PASS Stage17 structural original-file/source analysis; pixel CCM remains unproven')
          PY
          test -z "$(git ls-files 'hasselblad_native_audit/firmware/*.cim')"
      - name: Upload filtered original-source CCM structure report only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Hasselblad-Stage17-MAIN-CCM-Constraints
          path: ${{ runner.temp }}/STAGE17_ORIGINAL_CCM_CONSTRAINTS.json
          if-no-files-found: error
          retention-days: 7
