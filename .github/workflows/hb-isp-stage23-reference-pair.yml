name: Hasselblad Stage23 X2D II original image reference (no camera app changes)

'on':
  push:
    branches:
      - recovery/awb-rebuild-20261021
    paths:
      - 'hasselblad_native_audit/isp_empirical_stage23/**'
      - '.github/workflows/hb-isp-stage23-reference-pair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Do not modify installed camera, previous research or original firmware
        run: |
          set -euo pipefail
          git diff --quiet 4bb6052191a561031020fa6b3b98fbc44ec015c2 HEAD -- \
            HasselbladPhoton/app \
            hasselblad_native_audit/photographic_path \
            hasselblad_native_audit/main_colour_20261019 \
            hasselblad_native_audit/isp_main_stage20 \
            hasselblad_native_audit/isp_main_stage21 \
            hasselblad_native_audit/isp_main_stage22 \
            hasselblad_native_audit/isp_dng_stage18 \
            hasselblad_native_audit/isp_colour_stage19
          test -z "$(git ls-files 'hasselblad_native_audit/firmware/*.cim')"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded numerical/photo analysis dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libimage-exiftool-perl
          python -m pip install --disable-pip-version-check \
            'numpy>=2.1,<3' 'scikit-image>=0.24,<1' \
            'opencv-contrib-python-headless>=4.11,<5' \
            'rawpy>=0.23,<1' 'Pillow>=10,<14' 'requests>=2.31,<3'
      - name: Run fail-closed synthetic arithmetic and URL provenance controls
        run: |
          set -euo pipefail
          python hasselblad_native_audit/isp_empirical_stage23/src/pair_math23.py \
            --selftest --output "$RUNNER_TEMP/STAGE23_SYNTHETIC_PASS.json"
          python hasselblad_native_audit/isp_empirical_stage23/src/download_public23.py --selftest
          python hasselblad_native_audit/isp_empirical_stage23/tests/test_reference_pair23.py
          python - <<'PY'
          import cv2,rawpy,skimage
          assert hasattr(cv2,'mcc'), 'opencv-contrib ColorChecker detector required'
          print('PASS OpenCV ColorChecker and LibRaw interpreter available')
          PY
      - name: One genuine same-shutter X2D II chart RAW/JPEG pair, ephemeral only
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/hb23_original"
          mkdir -p "$DIR"
          trap 'rm -rf "$DIR"' EXIT
          python hasselblad_native_audit/isp_empirical_stage23/src/download_public23.py \
            --destination "$DIR"
          python hasselblad_native_audit/isp_empirical_stage23/src/run_public_pair23.py \
            --raw "$DIR/B_31325.3FR" --jpeg "$DIR/B_31325.JPG" \
            --output "$RUNNER_TEMP/STAGE23_REFERENCE_PUBLIC_AGGREGATE.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'STAGE23_REFERENCE_PUBLIC_AGGREGATE.json'
          d=json.loads(p.read_text())
          assert d['status']=='completed_with_comparable_chart_patches'
          assert d['reference_capture_stem']=='B_31325'
          assert d['patch_count']==24 and d['independent_light_scenes']==1
          assert d['original_camera_image_bytes_exported'] is False
          assert d['individual_pixel_or_patch_values_exported'] is False
          assert d['photographic_render_authorized'] is False
          assert d['HNCS_renderer_implemented'] is False
          assert d['Phocus_default_TIFF_available'] is False
          print('PASS real RAW+camera-JPEG source comparisons; no images retained in published receipt')
          PY
      - name: Publish only numeric reference receipt — never original image data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Hasselblad-Stage23-Original-Camera-Reference-Metrics
          path: |
            ${{ runner.temp }}/STAGE23_SYNTHETIC_PASS.json
            ${{ runner.temp }}/STAGE23_REFERENCE_PUBLIC_AGGREGATE.json
          retention-days: 7
          if-no-files-found: error
