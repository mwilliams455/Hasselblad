name: Hasselblad Stage24 native colour reference renderer (no HNCS claim)
on:
  push:
    branches: ['recovery/awb-rebuild-20261021']
    paths:
      - 'hasselblad_native_audit/isp_colour_stage24/**'
      - '.github/workflows/hb-isp-stage24-offline-render.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-colour-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prevent production changes or unrelated research overwrites
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only e7d91730cbec23e40778cfb6e6f5761374a66dd3 HEAD > /tmp/stage24_changed_paths
          if grep -Ev '^(hasselblad_native_audit/isp_colour_stage24/|\.github/workflows/hb-isp-stage24-offline-render\.yml$)' /tmp/stage24_changed_paths; then
            echo 'Unrelated or production source changed in Stage24 scope'; exit 1
          fi
          if git diff --name-only e7d91730cbec23e40778cfb6e6f5761374a66dd3 HEAD | grep '^HasselbladPhoton/app/'; then
            echo 'Phone rendering must remain unchanged'; exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Numerical research dependencies only
        run: python3 -m pip install --disable-pip-version-check numpy pillow tifffile opencv-python-headless
      - name: C native full pipeline versus independent NumPy (GCC)
        run: |
          python3 hasselblad_native_audit/isp_colour_stage24/tests/test_renderer24.py \
            --compiler gcc --output /tmp/STAGE24_SYNTHETIC_GCC.json
      - name: C native full pipeline versus independent NumPy (Clang)
        run: |
          python3 hasselblad_native_audit/isp_colour_stage24/tests/test_renderer24.py \
            --compiler clang --output /tmp/STAGE24_SYNTHETIC_CLANG.json
      - name: C memory checks with AddressSanitizer and UndefinedBehaviorSanitizer
        shell: bash
        run: |
          set -euo pipefail
          root=hasselblad_native_audit
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I $root/isp_dng_stage18/src -I $root/isp_colour_stage19/src \
            -I $root/isp_main_stage21/src -I $root/isp_colour_stage24/src \
            $root/isp_colour_stage24/tests/test_renderer24_sanitized.c \
            $root/isp_colour_stage24/src/hb24_renderer.c \
            $root/isp_dng_stage18/src/hb_dng_pcs_bridge.c \
            $root/isp_colour_stage19/src/hb_colour_stage19.c \
            $root/isp_main_stage21/src/hb_main_candidate21.c \
            -lm -o /tmp/hb24_asan
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 /tmp/hb24_asan
      - name: Prohibit private photo and original firmware in published receipts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('hasselblad_native_audit/isp_colour_stage24')
          for p in root.glob('STAGE24_SYNTHETIC_*.json'):
              d=json.loads(p.read_text())
              assert d['status']=='PASS'
              assert not d['Hasselblad_ISP_equivalence_proven']
              assert not d['vendor_main_lut_data_used']
              assert d['production_saved_photo_renderer_unchanged']
          for p in root.rglob('*'):
              if p.is_file():
                  assert p.suffix not in ('.dng','.3fr','.cim','.apk','.jpg','.jpeg','.png','.tif','.tiff','.so')
                  assert 'private' not in p.parts
          PY
      - name: Cross-compile bounded colour core for Android ARM64 (not integrated into APK)
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          cc="$sdk/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"
          if [ ! -x "$cc" ]; then
            yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$sdk/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;27.0.12077973' >/dev/null
          fi
          test -x "$cc"
          root=hasselblad_native_audit
          mkdir -p "$RUNNER_TEMP/stage24-android"
          "$cc" -std=c11 -O2 -fPIC -shared -ffp-contract=off -Wall -Wextra -Werror \
            -Wl,--no-undefined -Wl,-z,max-page-size=16384 \
            -I "$root/isp_dng_stage18/src" -I "$root/isp_colour_stage19/src" \
            -I "$root/isp_main_stage21/src" -I "$root/isp_colour_stage24/src" \
            "$root/isp_colour_stage24/src/hb24_renderer.c" \
            "$root/isp_dng_stage18/src/hb_dng_pcs_bridge.c" \
            "$root/isp_colour_stage19/src/hb_colour_stage19.c" \
            "$root/isp_main_stage21/src/hb_main_candidate21.c" \
            -lm -o "$RUNNER_TEMP/stage24-android/libhasselblad_colour_stage24.so"
          readelf -h "$RUNNER_TEMP/stage24-android/libhasselblad_colour_stage24.so" | grep 'AArch64'
          readelf -Wl "$RUNNER_TEMP/stage24-android/libhasselblad_colour_stage24.so" | grep 'LOAD'
          nm -D "$RUNNER_TEMP/stage24-android/libhasselblad_colour_stage24.so" | grep 'hb24_build'
          nm -D "$RUNNER_TEMP/stage24-android/libhasselblad_colour_stage24.so" | grep 'hb24_process'
          python3 - <<'PY_EMBEDDED'
          import hashlib,json,os,pathlib,re,subprocess
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'stage24-android/libhasselblad_colour_stage24.so'
          read=subprocess.check_output(['readelf','-Wl',str(path)],text=True)
          align=[int(line.split()[-1],16) for line in read.splitlines() if re.match(r'\s*LOAD\s+',line)]
          assert align and min(align)>=16384,align
          doc={'schema':'stage24-arm64-library-source-only-v1','abi':'arm64-v8a',
               'android_api':28,'status':'PASS','load_segment_alignment':align,
               'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),
               'proprietary_lut_bundled':False,'hasselblad_isp_parity_proven':False,
               'installed_apk_created':False,'source_only_research_library':True}
          (path.parent/'STAGE24_ARM64_COMPILE.json').write_text(json.dumps(doc,indent=2)+'\n')
          print(json.dumps(doc))
          PY_EMBEDDED
      - uses: actions/upload-artifact@v4
        with:
          name: Hasselblad-Stage24-Synthetic-C-Renderer-Only
          path: |
            /tmp/STAGE24_SYNTHETIC_GCC.json
            /tmp/STAGE24_SYNTHETIC_CLANG.json
            ${{ runner.temp }}/stage24-android/STAGE24_ARM64_COMPILE.json
            ${{ runner.temp }}/stage24-android/libhasselblad_colour_stage24.so
          if-no-files-found: error
          retention-days: 14
