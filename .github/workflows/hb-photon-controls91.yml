name: Hasselblad Stage91 JPEG sharpening controls APK
"on":
  push:
    branches: [experimental/phocus-controls91]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preserve RAW, colour, sharpening kernel and preview processing
        run: |
          python3 hasselblad_native_audit/phocus_controls_stage91/pins91.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sharpening controls and retained live tone switching checks
        run: |
          python -m pip install numpy==2.2.6
          python hasselblad_native_audit/phocus_preview_stage90/check90.py --work "$RUNNER_TEMP/hb90-tests"
          python hasselblad_native_audit/phocus_controls_stage91/check91.py --work "$RUNNER_TEMP/hb91-tests"
      - name: Install pinned Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.0.12077973' >/dev/null
      - name: Build APK with existing signing identity
        working-directory: HasselbladPhoton
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :app:assembleDebug
      - name: Verify APK and package build receipt
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find HasselbladPhoton/app/build/outputs/apk -type f -name '*debug.apk' -print -quit)"
          dest="$RUNNER_TEMP/hb91-deliver"
          mkdir -p "$dest"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > "$dest/signature.txt"
          grep -Fi '255cb09eaddd26a9cc680786e4985372cf24d0e54bb120fc44d48f3273ff3956' "$dest/signature.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$dest/badging.txt"
          grep -F "name='com.mwilliams.hasselbladphoton'" "$dest/badging.txt"
          grep -F "versionCode='27230'" "$dest/badging.txt"
          grep -F "versionName='0.1-hb-controls91'" "$dest/badging.txt"
          python3 - "$apk" "$dest" <<'PY'
          import hashlib,json,pathlib,subprocess,sys,zipfile,re
          apk,dest=map(pathlib.Path,sys.argv[1:])
          with zipfile.ZipFile(apk) as z:
              for abi in ('arm64-v8a','armeabi-v7a'):
                  for lib in ('libhbfinal74.so','libhbframe76.so','libhbframe77.so','libhasselblad_renderer42_jni.so','libdngCreator.so','libhbsharp86.so'):
                      payload=z.read('lib/'+abi+'/'+lib)
                      native=dest/'check.so';native.write_bytes(payload)
                      elf=subprocess.check_output(['readelf','-lW',str(native)],text=True)
                      align=[int(line.split()[-1],16) for line in elf.splitlines() if re.match(r'\s*LOAD\s+',line)]
                      assert align and min(align)>=16384
                      native.unlink()
              assert z.read('assets/shaders/preview/tone89.glsl')==pathlib.Path('HasselbladPhoton/app/src/main/assets/shaders/preview/tone89.glsl').read_bytes()
              for name in ('neutral64','colour64','random23'):
                  for suffix in ('input.u16le','rgb.u16le'):
                      p='stage75/'+name+'.'+suffix
                      assert z.read('assets/'+p)==(pathlib.Path('HasselbladPhoton/app/src/main/assets')/p).read_bytes()
              assert not any(n.endswith(('.hb42','.hbc','.hbt','.dng')) or 'libcrosssdk' in n for n in z.namelist())
          receipt={'status':'PASS_BUILD_ONLY','version_name':'0.1-hb-controls91','version_code':27230,
              'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'apk_sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),
              'renderer_abis':['arm64-v8a','armeabi-v7a'],'private_profile_or_photo_bundled':False,
              'device_tested':False,'sharpening_strength_range':[0,200],'sharpening_threshold_range':[0,32],
              'sharpening_defaults':{'enabled':False,'amount':100,'noise':0,'radius':1,'dark_limit':10},
              'legacy_enabled_selection_preserved':True,'zero_strength_exact_bypass':True,
              'sharpening_snapshot':'immutable tuple at processing start','sharpening_exif_recorded':True,
              'preview_sharpening':False,'preview_math_changed':False,'stage90_live_tone_updates_preserved':True,
              'stage90_live_switching_device_tested':False,'full_colour_preview_match_claimed':False,
              'capture_diagnostics_optional':True,'capture_diagnostics_default':False,
              'demosaic_and_colour_kernels_unchanged':True,'sharpening_kernel_unchanged':True,
              'capture_storage_publication_changed':False,'private_tone_pack_bundled':False}
          (dest/'STAGE91_APK_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          cp "$apk" "$dest/HasselbladPhoton-0.1-hb-controls91-27230.apk"
          cp "$RUNNER_TEMP/hb90-tests/STAGE90_HOST_VALIDATION.json" "$dest/"
          cp "$RUNNER_TEMP/hb91-tests/STAGE91_HOST_VALIDATION.json" "$dest/"
          cp "$RUNNER_TEMP/hb91-tests/STAGE87_HOST_VALIDATION.json" "$dest/"
          cp hasselblad_native_audit/phocus_controls_stage91/README.md "$dest/Stage91_Test_Instructions.md"
          cp hasselblad_native_audit/phocus_controls_stage91/CONTROL_INVENTORY.md "$dest/Stage91_Control_Inventory.md"
      - uses: actions/upload-artifact@v4
        with:
          name: HasselbladPhoton-controls91-APK-and-receipts
          path: ${{ runner.temp }}/hb91-deliver/
          retention-days: 14
