name: Hasselblad Stage75 saved-DNG device and colour test APK
"on":
  push:
    branches: [experimental/phocus-device75]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preserve normal capture and exact Stage74 native source
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only 1b7078f206ece1ca224cb6f99eff0be988b6796f HEAD -- HasselbladPhoton/app/src/main/java/com/particlesdevs/photoncamera/capture HasselbladPhoton/app/src/main/java/com/particlesdevs/photoncamera/processing hasselblad_native_audit/phocus_output_stage74)"
          test -z "$(git diff --name-only 1b7078f206ece1ca224cb6f99eff0be988b6796f HEAD -- HasselbladPhoton/app/src/main/assets ':!HasselbladPhoton/app/src/main/assets/stage75')"
          cmp HasselbladPhoton/app/src/main/java/com/particlesdevs/photoncamera/hasselblad/HasselbladFinalRaw74.java hasselblad_native_audit/phocus_output_stage74/java/com/particlesdevs/photoncamera/hasselblad/HasselbladFinalRaw74.java
      - name: Host sanitizer, JVM JNI and independent DNG preparation checks
        shell: bash
        run: |
          set -euo pipefail
          sh hasselblad_native_audit/phocus_output_stage74/run_host74.sh "$RUNNER_TEMP/hb75-asan"
          sh hasselblad_native_audit/phocus_output_stage74/run_jni_host74.sh "$RUNNER_TEMP/hb75-jni"
          python3 hasselblad_native_audit/phocus_output_stage74/test_output74.py
          python3 hasselblad_native_audit/phocus_device_stage75/check75.py --work "$RUNNER_TEMP/hb75-tests" --jni "$JAVA_HOME/include"
      - name: Install pinned Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.0.12077973' >/dev/null
      - name: Build diagnostic APK with existing signing identity
        working-directory: HasselbladPhoton
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :app:assembleDebug
      - name: Verify APK and package build receipt
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find HasselbladPhoton/app/build/outputs/apk -type f -name '*debug.apk' -print -quit)"
          dest="$RUNNER_TEMP/hb75-deliver"
          mkdir -p "$dest"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > "$dest/signature.txt"
          grep -Fi '255cb09eaddd26a9cc680786e4985372cf24d0e54bb120fc44d48f3273ff3956' "$dest/signature.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$dest/badging.txt"
          grep -F "name='com.mwilliams.hasselbladphoton'" "$dest/badging.txt"
          grep -F "versionCode='27215'" "$dest/badging.txt"
          grep -F "versionName='0.1-hb-device75'" "$dest/badging.txt"
          python3 - "$apk" "$dest" <<'PY'
          import hashlib,json,pathlib,subprocess,sys,zipfile,re
          apk,dest=map(pathlib.Path,sys.argv[1:])
          with zipfile.ZipFile(apk) as z:
              for abi in ('arm64-v8a','armeabi-v7a'):
                  for lib in ('libhbfinal74.so','libhasselblad_renderer42_jni.so'):
                      payload=z.read('lib/'+abi+'/'+lib)
                      native=dest/'check.so';native.write_bytes(payload)
                      elf=subprocess.check_output(['readelf','-lW',str(native)],text=True)
                      align=[int(line.split()[-1],16) for line in elf.splitlines() if re.match(r'\s*LOAD\s+',line)]
                      assert align and min(align)>=16384
                      native.unlink()
              for name in ('neutral64','colour64','random23'):
                  for suffix in ('input.u16le','rgb.u16le'):
                      p='stage75/'+name+'.'+suffix
                      assert z.read('assets/'+p)==(pathlib.Path('HasselbladPhoton/app/src/main/assets')/p).read_bytes()
              assert not any(n.endswith(('.hb42','.hbc','.dng')) or 'libcrosssdk' in n for n in z.namelist())
          receipt={'status':'PASS_BUILD_ONLY','version_name':'0.1-hb-device75','version_code':27215,
              'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'apk_sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),
              'renderer_abis':['arm64-v8a','armeabi-v7a'],'private_profile_or_photo_bundled':False,
              'device_tested':False,'capture_renderer_changed':False,'saved_dng_host_parity':False}
          (dest/'STAGE75_APK_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          cp "$apk" "$dest/HasselbladPhoton-0.1-hb-device75-27215.apk"
          cp hasselblad_native_audit/phocus_device_stage75/README.md "$dest/Stage75_Test_Instructions.md"
      - uses: actions/upload-artifact@v4
        with:
          name: HasselbladPhoton-device75-APK-and-receipts
          path: ${{ runner.temp }}/hb75-deliver/
          retention-days: 14
