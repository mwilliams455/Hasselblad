name: Hasselblad Stage89 preview tone APK
"on":
  push:
    branches: [experimental/phocus-preview89]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preserve the complete saved-photo pipeline
        run: |
          python3 hasselblad_native_audit/phocus_preview_stage89/pins89.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preview table, lifecycle and GPU checks
        run: |
          python -m pip install numpy==2.2.6 Pillow==11.2.1
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1-mesa-dri
          python hasselblad_native_audit/phocus_preview_stage89/check89.py --work "$RUNNER_TEMP/hb89-tests"
      - name: Install pinned Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.0.12077973' >/dev/null
      - name: Build APK with existing signing identity
        working-directory: HasselbladPhoton
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :app:assembleDebug
      - name: Verify APK and package build receipt
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find HasselbladPhoton/app/build/outputs/apk -type f -name '*debug.apk' -print -quit)"
          dest="$RUNNER_TEMP/hb89-deliver"
          mkdir -p "$dest"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > "$dest/signature.txt"
          grep -Fi '255cb09eaddd26a9cc680786e4985372cf24d0e54bb120fc44d48f3273ff3956' "$dest/signature.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$dest/badging.txt"
          grep -F "name='com.mwilliams.hasselbladphoton'" "$dest/badging.txt"
          grep -F "versionCode='27228'" "$dest/badging.txt"
          grep -F "versionName='0.1-hb-preview89'" "$dest/badging.txt"
          python3 - "$apk" "$dest" <<'PY'
          import hashlib,json,pathlib,subprocess,sys,zipfile,re
          apk,dest=map(pathlib.Path,sys.argv[1:])
          with zipfile.ZipFile(apk) as z:
              for abi in ('arm64-v8a','armeabi-v7a'):
                  for lib in ('libhbfinal74.so','libhbframe76.so','libhbframe77.so','libhasselblad_renderer42_jni.so','libdngCreator.so','libhbsharp86.so'):
                      payload=z.read('lib/'+abi+'/'+lib)
                      native=dest/'check.so';native.write_bytes(payload)
                      elf=subprocess.check_output(['readelf','-lW',str(native)],text=True)
                      align=[int(line.split()[-1],16) for line in elf.splitlines() if re.match(r'\s*LOAD\s+',line)]
                      assert align and min(align)>=16384
                      native.unlink()
              assert z.read('assets/shaders/preview/tone89.glsl')==pathlib.Path('HasselbladPhoton/app/src/main/assets/shaders/preview/tone89.glsl').read_bytes()
              for name in ('neutral64','colour64','random23'):
                  for suffix in ('input.u16le','rgb.u16le'):
                      p='stage75/'+name+'.'+suffix
                      assert z.read('assets/'+p)==(pathlib.Path('HasselbladPhoton/app/src/main/assets')/p).read_bytes()
              assert not any(n.endswith(('.hb42','.hbc','.hbt','.dng')) or 'libcrosssdk' in n for n in z.namelist())
          receipt={'status':'PASS_BUILD_ONLY','version_name':'0.1-hb-preview89','version_code':27228,
              'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'apk_sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),
              'renderer_abis':['arm64-v8a','armeabi-v7a'],'private_profile_or_photo_bundled':False,
              'device_tested':False,'capture_pixel_math_changed':False,'finishing_lookup_cache_added':False,'stage88_finishing_cache_preserved':True,'preview_tone_guide_added':True,'preview_default_enabled_with_matching_profile_and_pack':True,'full_colour_preview_match_claimed':False,'native_cache_bytes':393216,'capture_sharpening_default':False,'capture_off_pixels_unchanged':True,'capture_storage_publication_changed':False,'capture_diagnostics_optional':True,'capture_diagnostics_default':False,'capture_diagnostics_preference_preserved':True,
              'demosaic_and_colour_kernels_unchanged':True,'stage55_reference_unchanged':True,'sharpening_kernel_unchanged':True,'sharpening_camera_optional':True,'sharpening_comparison_retained':True,'private_tone_pack_bundled':False,
              'prior_stage82_shutter_and_saved_dng_pixel_parity_device_validated':True}
          (dest/'STAGE89_APK_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          cp "$apk" "$dest/HasselbladPhoton-0.1-hb-preview89-27228.apk"
          cp "$RUNNER_TEMP/hb89-tests/STAGE89_HOST_VALIDATION.json" "$dest/"
          cp hasselblad_native_audit/phocus_preview_stage89/README.md "$dest/Stage89_Test_Instructions.md"
      - uses: actions/upload-artifact@v4
        with:
          name: HasselbladPhoton-preview89-APK-and-receipts
          path: ${{ runner.temp }}/hb89-deliver/
          retention-days: 14
