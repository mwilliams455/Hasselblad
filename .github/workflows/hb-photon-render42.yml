name: Hasselblad Stage42 experimental saved-RAW colour APK
"on":
  push:
    branches: [experimental/phocus-render42]
    paths:
      - 'HasselbladPhoton/**'
      - 'hasselblad_native_audit/phocus_port_stage42/**'
      - '.github/workflows/hb-photon-render42.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm isolated renderer and private data boundary
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only 5889f0d6f1189caaa41f4629d65bbc1923dd0c62 HEAD -- HasselbladPhoton/app/src/main/java/com/particlesdevs/photoncamera/capture HasselbladPhoton/app/src/main/java/com/particlesdevs/photoncamera/processing HasselbladPhoton/app/src/main/assets)"
          test -z "$(git ls-files 'hasselblad_native_audit/phocus_port_stage42/*.hb42' 'hasselblad_native_audit/phocus_port_stage42/*.dat' 'hasselblad_native_audit/phocus_port_stage42/*.so')"
      - name: Portable synthetic core and actual JNI bridge checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check numpy==2.3.5
          python3 hasselblad_native_audit/phocus_port_stage42/test_core42.py -v
          mkdir -p "$RUNNER_TEMP/hb42/classes" "$RUNNER_TEMP/hb42/lib" "$RUNNER_TEMP/hb42/deliver"
          src=HasselbladPhoton/app/src/main
          audit=hasselblad_native_audit/phocus_port_stage42
          javac --release 17 -d "$RUNNER_TEMP/hb42/classes" \
            "$src/java/com/particlesdevs/photoncamera/hasselblad/HasselbladRenderer42.java" \
            "$src/java/com/particlesdevs/photoncamera/hasselblad/HasselbladRenderBundle42.java" \
            "$audit/Stage42BridgeSmoke.java"
          gcc -std=c11 -O2 -Wall -Wextra -Werror -fPIC -ffp-contract=off -shared \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" -I"$audit/src" \
            "$src/cpp/hasselblad/hb_renderer42_jni.c" "$audit/src/hb42_colour.c" \
            -Wl,--no-undefined -lm -o "$RUNNER_TEMP/hb42/lib/libhasselblad_renderer42_jni.so"
          java -Djava.library.path="$RUNNER_TEMP/hb42/lib" -cp "$RUNNER_TEMP/hb42/classes" \
            Stage42BridgeSmoke | tee "$RUNNER_TEMP/hb42/deliver/STAGE42_HOST_JNI.json"
      - name: Install pinned Android build toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install \
            'platforms;android-36' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.0.12077973' >/dev/null
      - name: Build Stage42 APK using existing signing identity
        working-directory: HasselbladPhoton
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :app:assembleDebug
      - name: Verify APK identity, version and both renderer ABIs
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find HasselbladPhoton/app/build/outputs/apk -type f -name '*debug.apk' -print -quit)"
          test -s "$apk"
          dest="$RUNNER_TEMP/hb42/deliver"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > "$dest/signature.txt"
          grep -Fi '255cb09eaddd26a9cc680786e4985372cf24d0e54bb120fc44d48f3273ff3956' "$dest/signature.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$dest/badging.txt"
          grep -F "name='com.mwilliams.hasselbladphoton'" "$dest/badging.txt"
          grep -F "versionCode='27191'" "$dest/badging.txt"
          grep -F "versionName='0.1-hb-render42'" "$dest/badging.txt"
          python3 - "$apk" "$dest" <<'PY'
          import hashlib,json,pathlib,subprocess,sys,zipfile,re
          apk,dest=map(pathlib.Path,sys.argv[1:])
          with zipfile.ZipFile(apk) as z:
              for abi in ('arm64-v8a','armeabi-v7a'):
                  payload=z.read('lib/'+abi+'/libhasselblad_renderer42_jni.so')
                  native=dest/'check.so';native.write_bytes(payload)
                  elf=subprocess.check_output(['readelf','-lW',str(native)],text=True)
                  alignment=[int(line.split()[-1],16) for line in elf.splitlines() if re.match(r'\s*LOAD\s+',line)]
                  assert alignment and min(alignment)>=16384
                  native.unlink()
              assert not any(n.endswith('.hb42') or 'libcrosssdk' in n or 'bohnjuhtuvuvtxyydb56' in n for n in z.namelist())
          report={'status':'PASS_BUILD_ONLY','version_name':'0.1-hb-render42','version_code':27191,
              'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'apk_sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),
              'renderer_abis':['arm64-v8a','armeabi-v7a'],'private_profile_or_photo_bundled':False,
              'device_tested':False,'capture_renderer_changed':False}
          (dest/'STAGE42_APK_RECEIPT.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
          cp "$apk" "$dest/HasselbladPhoton-0.1-hb-render42-27191.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: HasselbladPhoton-render42-APK-and-build-receipts
          path: ${{ runner.temp }}/hb42/deliver/
          retention-days: 14
