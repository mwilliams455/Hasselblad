name: Hasselblad REA e91c TEE operation ABI — Stage27
"on":
  push:
    branches: [research/rea-tee-20261024]
    paths:
      - 'hasselblad_native_audit/tee_provision_stage22/inspect_efuse_contract27.py'
      - 'hasselblad_native_audit/tee_provision_stage22/inspect_wide_zero28.py'
      - 'hasselblad_native_audit/tee_provision_stage22/inspect_op_alias29.py'
      - '.github/workflows/hb-rea-efuse-contract27.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-tee-contract-read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout isolated research source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stage27 synthetic contract test before any firmware download
        shell: bash
        run: |
          set -euo pipefail
          p=hasselblad_native_audit/tee_provision_stage22/inspect_efuse_contract27.py
          python3 -m py_compile "$p"
          python3 -m py_compile hasselblad_native_audit/tee_provision_stage22/inspect_wide_zero28.py
          python3 -m py_compile hasselblad_native_audit/tee_provision_stage22/inspect_op_alias29.py
          python3 hasselblad_native_audit/tee_provision_stage22/inspect_op_alias29.py \
            --self-test --output "$RUNNER_TEMP/HB_STAGE29_SYNTHETIC.json"
          python3 hasselblad_native_audit/tee_provision_stage22/inspect_wide_zero28.py \
            --self-test --output "$RUNNER_TEMP/HB_STAGE28_SYNTHETIC.json"
          python3 "$p" --self-test --output "$RUNNER_TEMP/HB_STAGE27_SYNTHETIC.json"
          python3 - "$RUNNER_TEMP/HB_STAGE27_SYNTHETIC.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["status"]=="PASS_synthetic" and x["checks"]==3
          PY
      - name: Install pinned-format extraction and static ELF analysis dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'cryptography>=42,<47' 'brotli>=1.1,<2' 'dissect.extfs>=3,<4' 'pyelftools>=0.31,<1' 'capstone>=5,<6' > "$RUNNER_TEMP/HB27_PIP_PRIVATE.log" 2>&1
      - name: Obtain official original X2D II firmware and verify SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hasselblad_native_audit/firmware
          p=hasselblad_native_audit/firmware/X2DII_100C_v1_3_16_2.cim
          curl --fail --location --silent --show-error --retry 3 --retry-delay 3 --connect-timeout 30 --max-time 600 'https://cdn.hasselblad.com/firmware/X2D_II_100C_Firmware/1.3.16.2/X2DII_100C_v1_3_16_2(1).cim' --output "$p"
          test "$(stat -c %s "$p")" -eq 364814336
          echo '9789d6a9843d388034bc12341ad9a97585c25cb98cf11a0da8b768399b4842f6  '"$p" | sha256sum -c -
      - name: Extract original vendor/system to transient filesystem
        shell: bash
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/extract_official.py > "$RUNNER_TEMP/HB27_EXTRACT_PRIVATE.log"
      - name: Inspect original second-TEE commands 0,3,32 and operation ABI
        shell: bash
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/tee_provision_stage22/inspect_efuse_contract27.py \
            --firmware-root hasselblad_native_audit/firmware/extracted \
            --output "$RUNNER_TEMP/HB_STAGE27_ORIGINAL_SAFE.json"
          python3 - "$RUNNER_TEMP/HB_STAGE27_ORIGINAL_SAFE.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r["schema"]=="hasselblad-stage27-original-e91c-TEE-operation-ABI-v1"
          assert len(r["functions"])==3
          assert [x["verified_command_id"] for x in r["functions"]]==[0,3,32]
          assert not r["original_eFuse_or_device_operation_executed"]
          assert not r["private_literal_bytes_or_vendor_pseudocode_exported"]
          PY
      - name: Inspect wide and SIMD zero-initialisation of original eFuse command 0
        shell: bash
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/tee_provision_stage22/inspect_wide_zero28.py \
            --firmware-root hasselblad_native_audit/firmware/extracted \
            --output "$RUNNER_TEMP/HB_STAGE28_ORIGINAL_SAFE.json"
          python3 - "$RUNNER_TEMP/HB_STAGE28_ORIGINAL_SAFE.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r["schema"]=="hasselblad-stage28-original-eFuse-command0-zero-contract-v1"
          assert r["command_id"]==0 and r["operation_base_sp"]==72
          assert not r["eFuse_pro_operation_executed"]
          assert not r["raw_manufacturer_code_or_unknown_data_exported"]
          PY
      - name: Trace eFuse command0 indirect SP stores and libc zeroing candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/tee_provision_stage22/inspect_op_alias29.py \
            --firmware-root hasselblad_native_audit/firmware/extracted \
            --output "$RUNNER_TEMP/HB_STAGE29_ORIGINAL_SAFE.json"
          python3 - "$RUNNER_TEMP/HB_STAGE29_ORIGINAL_SAFE.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["schema"]=="hasselblad-stage29-original-command0-indirect-TEE-operation-init-v1"
          assert d["TEE_command_id"]==0 and d["TEE_operation_sp"]==72
          assert not d["secret_material_or_proprietary_code_exported"]
          assert not d["original_TEE_or_eFuse_executed"]
          PY
      - name: Set up supported REA Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify actual original ELF through REA objdump without exporting symbols
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu >/dev/null
          npm install -g --no-audit --no-fund rea-agents@latest > "$RUNNER_TEMP/HB27_REA_PRIVATE.log" 2>&1
          export REA_OBJDUMP_COMMAND="$(command -v aarch64-linux-gnu-objdump)"
          original=hasselblad_native_audit/firmware/extracted/system/lib64/libamt_util.so
          rea inspect-with-objdump "$original" symbols --format json > "$RUNNER_TEMP/HB27_REA_PRIVATE_OUT.json"
          python3 - "$RUNNER_TEMP/HB27_REA_PRIVATE_OUT.json" "$RUNNER_TEMP/HB_STAGE27_REA_SAFE.json" <<'PY'
          import json,sys
          from pathlib import Path
          source=json.loads(Path(sys.argv[1]).read_text())
          assert isinstance(source,dict)
          Path(sys.argv[2]).write_text(json.dumps({
           "provider":"REA_GNU_objdump","original_AArch64_ELF":True,
           "rea_symbols_parsed_as_json":True,
           "secure_TA_executed_or_decompiled":False,
           "vendor_instruction_bytes_or_secret_material_exported":False},indent=2)+"\n")
          PY
      - name: Delete all original firmware, code and private tool output
        if: always()
        shell: bash
        run: |
          rm -f hasselblad_native_audit/firmware/X2DII_100C_v1_3_16_2.cim
          rm -rf hasselblad_native_audit/firmware/extracted
          rm -f "$RUNNER_TEMP/HB27_PIP_PRIVATE.log" "$RUNNER_TEMP/HB27_EXTRACT_PRIVATE.log" "$RUNNER_TEMP/HB27_REA_PRIVATE.log" "$RUNNER_TEMP/HB27_REA_PRIVATE_OUT.json"
      - name: Publish safe static evidence only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Hasselblad-REA-e91c-Contract-Stage27-Safe
          path: |
            ${{ runner.temp }}/HB_STAGE27_SYNTHETIC.json
            ${{ runner.temp }}/HB_STAGE27_ORIGINAL_SAFE.json
            ${{ runner.temp }}/HB_STAGE27_REA_SAFE.json
            ${{ runner.temp }}/HB_STAGE28_SYNTHETIC.json
            ${{ runner.temp }}/HB_STAGE28_ORIGINAL_SAFE.json
            ${{ runner.temp }}/HB_STAGE29_SYNTHETIC.json
            ${{ runner.temp }}/HB_STAGE29_ORIGINAL_SAFE.json
          if-no-files-found: error
          retention-days: 14
