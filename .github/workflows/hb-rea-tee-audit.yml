name: Hasselblad TEE boundary REA static audit
"on":
  push:
    branches: [research/rea-tee-20261024]
    paths: ['.github/workflows/hb-rea-tee-audit.yml', 'hasselblad_native_audit/tee_rea_20261024/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-tee-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python original-source inspector self-test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile hasselblad_native_audit/tee_rea_20261024/inspect_tee_boundary.py
          python3 hasselblad_native_audit/tee_rea_20261024/inspect_tee_boundary.py --self-test --output "$RUNNER_TEMP/HB_TEE_SYNTHETIC_SAFE.json"
          python3 - "$RUNNER_TEMP/HB_TEE_SYNTHETIC_SAFE.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["status"]=="PASS_synthetic" and x["source_is_original"] is False
          PY
      - name: Install existing pinned firmware parser requirements
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'cryptography>=42,<47' 'brotli>=1.1,<2' 'dissect.extfs>=3,<4' 'pyelftools>=0.31,<1' 'capstone>=5,<6'
      - name: Download exact official original firmware only inside runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hasselblad_native_audit/firmware
          p=hasselblad_native_audit/firmware/X2DII_100C_v1_3_16_2.cim
          curl --fail --location --silent --show-error --retry 3 --retry-delay 3 --connect-timeout 30 --max-time 600 'https://cdn.hasselblad.com/firmware/X2D_II_100C_Firmware/1.3.16.2/X2DII_100C_v1_3_16_2(1).cim' --output "$p"
          test "$(stat -c %s "$p")" -eq 364814336
          echo '9789d6a9843d388034bc12341ad9a97585c25cb98cf11a0da8b768399b4842f6  '"$p" | sha256sum -c -
      - name: Extract original OTA privately without executing vendor code
        shell: bash
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/extract_official.py > "$RUNNER_TEMP/TEE_PRIVATE_EXTRACT.log"
      - name: Scan trusted-app UUID in extracted original system and vendor
        shell: bash
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/tee_rea_20261024/inspect_tee_boundary.py --firmware-root hasselblad_native_audit/firmware/extracted --output "$RUNNER_TEMP/HB_TEE_ORIGINAL_SAFE.json"
          python3 - "$RUNNER_TEMP/HB_TEE_ORIGINAL_SAFE.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["scanned_bytes"]>0 and x["files_listed"]>100
          assert x["no_vendor_binary_bytes_exported"] and not x["original_firmware_decrypted_inner_dsp"]
          PY
      - name: Set up a supported REA Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install REA and AArch64 objdump for static analysis
        shell: bash
        run: |
          set -uo pipefail
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu >/dev/null 2>&1
          if npm install -g --no-audit --no-fund rea-agents@latest > "$RUNNER_TEMP/REA_NPM_PRIVATE.log" 2>&1; then
            echo "REA package installed"
          else
            echo "REA package unavailable, will report this honestly"
          fi
      - name: Run bounded real REA objdump analysis without exporting disassembly
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/HB_TEE_ORIGINAL_SAFE.json" "$RUNNER_TEMP/HB_TEE_REA_EXECUTION_SAFE.json" <<'PY'
          import json,os,shutil,subprocess,sys
          from pathlib import Path
          src=json.loads(Path(sys.argv[1]).read_text())
          rea=shutil.which("rea")
          obj=shutil.which("aarch64-linux-gnu-objdump")
          result={"schema":"hasselblad-rea-tee-execution-20261024-v1",
                  "rea_cli_available":bool(rea),"objdump_available":bool(obj),
                  "provider":"REA_GNU_objdump_static",
                  "actual_original_elf_results":[],
                  "trusted_app_decrypted":False,"dsp_decrypted":False,
                  "executable_vendor_code_exported":False}
          if rea and obj:
              for item in src["named_targets"]:
                  if item.get("magic")!="ELF" or not item.get("content_scanned"):continue
                  rel=item["path"]
                  target=Path("hasselblad_native_audit/firmware/extracted")/rel
                  env=os.environ.copy();env["REA_OBJDUMP_COMMAND"]=obj
                  d={"path":rel,"rea_invoked":True,"returncode":None,"json_parsed":False}
                  try:
                      p=subprocess.run([rea,"inspect-with-objdump",str(target),"symbols","--format","json"],capture_output=True,env=env,timeout=120)
                      d["returncode"]=p.returncode
                      if p.returncode==0:
                          try:d["json_parsed"]=isinstance(json.loads(p.stdout),dict)
                          except (ValueError,UnicodeDecodeError):pass
                  except (OSError,subprocess.TimeoutExpired) as exc:
                      d["error_class"]=type(exc).__name__
                  if rea and obj and rel=="system/lib64/libfw_util_ca.so":
                      try:
                          p2=subprocess.run([rea,"inspect-with-objdump",str(target),
                                            "disassemble","--format","json"],
                                           capture_output=True,env=env,timeout=120)
                          d["rea_disassembly_exit_code"]=p2.returncode
                          if p2.returncode==0:
                              try:d["rea_disassembly_evidence_json"]=isinstance(json.loads(p2.stdout),dict)
                              except (ValueError,UnicodeDecodeError):d["rea_disassembly_evidence_json"]=False
                      except (OSError,subprocess.TimeoutExpired) as exc:
                          d["rea_disassembly_failure_class"]=type(exc).__name__
                  result["actual_original_elf_results"].append(d)
          Path(sys.argv[2]).write_text(json.dumps(result,sort_keys=True,indent=2)+"\n")
          print(json.dumps({"REA_executable_available":result["rea_cli_available"],
              "REA_native_checks":len(result["actual_original_elf_results"]),
              "json_pass":sum(r["json_parsed"] for r in result["actual_original_elf_results"])},sort_keys=True))
          PY
      - name: Trace original TEEC command sites and boot-area boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile hasselblad_native_audit/tee_rea_20261024/trace_tee_keypath.py
          python3 hasselblad_native_audit/tee_rea_20261024/trace_tee_keypath.py \
            --self-test --output "$RUNNER_TEMP/HB_TEE_KEYPATH_SYNTHETIC.json"
          python3 hasselblad_native_audit/tee_rea_20261024/trace_tee_keypath.py \
            --firmware-root hasselblad_native_audit/firmware/extracted \
            --cim hasselblad_native_audit/firmware/X2DII_100C_v1_3_16_2.cim \
            --output "$RUNNER_TEMP/HB_TEE_KEYPATH_ORIGINAL_SAFE.json"
          python3 - "$RUNNER_TEMP/HB_TEE_KEYPATH_ORIGINAL_SAFE.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["schema"]=="hasselblad-rea-tee-keypath-stage4-v1"
          assert x["host_tee_trace"]["text_instructions_examined"]>100
          assert not x["cryptographic_key_recovered"] and not x["vendor_binaries_exported"]
          PY
      - name: Original X2D II key-selector caller and ABI provenance audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile hasselblad_native_audit/tee_rea_20261024/inspect_key_selectors5.py
          python3 hasselblad_native_audit/tee_rea_20261024/inspect_key_selectors5.py \
            --self-test --output "$RUNNER_TEMP/HB_REA_SELECTOR5_SYNTHETIC.json"
          python3 hasselblad_native_audit/tee_rea_20261024/inspect_key_selectors5.py \
            --firmware-root hasselblad_native_audit/firmware/extracted \
            --output "$RUNNER_TEMP/HB_REA_SELECTOR5_ORIGINAL_SAFE.json"
          python3 - "$RUNNER_TEMP/HB_REA_SELECTOR5_ORIGINAL_SAFE.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["schema"]=="hasselblad-rea-key-selector-normal-world-stage5-v1"
          assert len(d["files"])==3
          assert d["no_original_instruction_bytes_or_text_exported"]
          assert not d["TEE_key_value_or_plaintext_recovered"]
          PY
      - name: Identify real original X2D II verifier-library and command-6 caller topology
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile hasselblad_native_audit/tee_rea_20261024/inspect_verifier_topology6.py
          python3 hasselblad_native_audit/tee_rea_20261024/inspect_verifier_topology6.py \
            --self-test --output "$RUNNER_TEMP/HB_REA_VERIFIER6_SYNTHETIC.json"
          python3 hasselblad_native_audit/tee_rea_20261024/inspect_verifier_topology6.py \
            --firmware-root hasselblad_native_audit/firmware/extracted \
            --output "$RUNNER_TEMP/HB_REA_VERIFIER6_ORIGINAL_SAFE.json"
          python3 - "$RUNNER_TEMP/HB_REA_VERIFIER6_ORIGINAL_SAFE.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["schema"]=="hasselblad-stage6-original-verifier-symbol-topology-v1"
          assert len(x["sources"])==4 and not x["cryptographic_key_recovered"]
          PY
      - name: Verify original II-generation duplicated version value and register origin
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile hasselblad_native_audit/tee_rea_20261024/prove_version_alias8.py
          python3 hasselblad_native_audit/tee_rea_20261024/prove_version_alias8.py \
            --self-test --output "$RUNNER_TEMP/HB_REA_ALIAS8_SYNTHETIC.json"
          python3 hasselblad_native_audit/tee_rea_20261024/prove_version_alias8.py \
            --firmware-root hasselblad_native_audit/firmware/extracted \
            --output "$RUNNER_TEMP/HB_REA_ALIAS8_ORIGINAL_SAFE.json"
          python3 - "$RUNNER_TEMP/HB_REA_ALIAS8_ORIGINAL_SAFE.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r["schema"]=="hasselblad-stage8-original-x2dii-selector-alias-v1"
          assert r["version_slots_both_from_same_callee_saved_register"] is True
          assert r["original_instruction_bytes_or_disassembly_exported"] is False
          PY
      - name: Provision approved Java 21 runtime for REA Ghidra
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Acquire pinned official Ghidra 12.1.4 with SHA-256 check
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/hbghidra"
          archive="$RUNNER_TEMP/hbghidra/ghidra_12.1.4_PUBLIC_20260921.zip"
          if curl --fail --location --silent --show-error --retry 2 --retry-delay 5 \
            --connect-timeout 25 --max-time 650 \
            'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip' --output "$archive" \
            && test "$(stat -c %s "$archive")" -eq 569649598 \
            && echo "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  $archive" | sha256sum -c - \
            && unzip -q "$archive" -d "$RUNNER_TEMP/hbghidra"; then
            echo "GHIDRA_INSTALL_DIR=$RUNNER_TEMP/hbghidra/ghidra_12.1.4_PUBLIC" >> "$GITHUB_ENV"
            echo "REA_GHIDRA_STARTUP_TIMEOUT_MS=240000" >> "$GITHUB_ENV"
            echo "Pinned Ghidra verified, ready for REA provider test"
          else
            echo "Pinned Ghidra not installed; safe report will show limitation"
          fi
          rm -f "$archive"
      - name: REA Ghidra decompilation of actual host-side TEE calls
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile hasselblad_native_audit/tee_rea_20261024/rea_decompile_tee.py
          python3 hasselblad_native_audit/tee_rea_20261024/rea_decompile_tee.py \
            --binary hasselblad_native_audit/firmware/extracted/system/lib64/libfw_util_ca.so \
            --output "$RUNNER_TEMP/HB_TEE_GHIDRA_SAFE.json"
          python3 - "$RUNNER_TEMP/HB_TEE_GHIDRA_SAFE.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["vendor_code_in_report"] is False
          assert d["secure_world_decompiled"] is False
          assert d["keys_recovered"] is False
          PY
      - name: REA Ghidra key-selector caller path across original binaries
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile hasselblad_native_audit/tee_rea_20261024/rea_selectors5.py
          python3 hasselblad_native_audit/tee_rea_20261024/rea_selectors5.py \
            --firmware-root hasselblad_native_audit/firmware/extracted \
            --output "$RUNNER_TEMP/HB_REA_SELECTOR5_GHIDRA_SAFE.json"
          python3 - "$RUNNER_TEMP/HB_REA_SELECTOR5_GHIDRA_SAFE.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["no_pseudocode_exported"] and d["TEE_decrypted"] is False
          assert d["secret_material_exported"] is False
          PY
      - name: Remove original firmware and REA logs even if analysis failed
        if: always()
        shell: bash
        run: |
          rm -f hasselblad_native_audit/firmware/X2DII_100C_v1_3_16_2.cim
          rm -rf hasselblad_native_audit/firmware/extracted
          rm -f "$RUNNER_TEMP/TEE_PRIVATE_EXTRACT.log" "$RUNNER_TEMP/REA_NPM_PRIVATE.log"
          rm -rf "$RUNNER_TEMP/hbghidra"
      - name: Publish only bounded, non-proprietary metadata reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Hasselblad-TEE-REA-Safe-20261024
          path: |
            ${{ runner.temp }}/HB_TEE_SYNTHETIC_SAFE.json
            ${{ runner.temp }}/HB_TEE_ORIGINAL_SAFE.json
            ${{ runner.temp }}/HB_TEE_REA_EXECUTION_SAFE.json
            ${{ runner.temp }}/HB_TEE_KEYPATH_SYNTHETIC.json
            ${{ runner.temp }}/HB_TEE_KEYPATH_ORIGINAL_SAFE.json
            ${{ runner.temp }}/HB_TEE_GHIDRA_SAFE.json
            ${{ runner.temp }}/HB_REA_SELECTOR5_SYNTHETIC.json
            ${{ runner.temp }}/HB_REA_SELECTOR5_ORIGINAL_SAFE.json
            ${{ runner.temp }}/HB_REA_SELECTOR5_GHIDRA_SAFE.json
            ${{ runner.temp }}/HB_REA_VERIFIER6_SYNTHETIC.json
            ${{ runner.temp }}/HB_REA_VERIFIER6_ORIGINAL_SAFE.json
            ${{ runner.temp }}/HB_REA_ALIAS8_SYNTHETIC.json
            ${{ runner.temp }}/HB_REA_ALIAS8_ORIGINAL_SAFE.json
          if-no-files-found: error
          retention-days: 14
