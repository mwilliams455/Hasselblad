name: Hasselblad REA eFuse-to-TEE call-graph — Stage23
"on":
  push:
    branches: [research/rea-tee-20261024]
    paths:
      - 'hasselblad_native_audit/tee_provision_stage22/audit_efuse_tee23.py'
      - '.github/workflows/hb-rea-tee-efuse23.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  original-efuse-static-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source and synthetic preflight
        shell: bash
        run: |
          set -euo pipefail
          p=hasselblad_native_audit/tee_provision_stage22/audit_efuse_tee23.py
          python3 -m py_compile "$p"
          python3 "$p" --self-test --output "$RUNNER_TEMP/HB23_SYNTHETIC.json"
          python3 - "$RUNNER_TEMP/HB23_SYNTHETIC.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r["status"]=="PASS_synthetic" and not r["original_input_used"]
          PY
      - name: Install extraction, capstone and ELF libraries
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'cryptography>=42,<47' 'brotli>=1.1,<2' 'dissect.extfs>=3,<4' 'pyelftools>=0.31,<1' 'capstone>=5,<6' > "$RUNNER_TEMP/HB23_PIP_PRIVATE.log" 2>&1
      - name: Fetch and verify exact official X2D II 1.3.16.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hasselblad_native_audit/firmware
          p=hasselblad_native_audit/firmware/X2DII_100C_v1_3_16_2.cim
          curl --fail --location --silent --show-error --retry 3 --retry-delay 3 --connect-timeout 30 --max-time 600 'https://cdn.hasselblad.com/firmware/X2D_II_100C_Firmware/1.3.16.2/X2DII_100C_v1_3_16_2(1).cim' --output "$p"
          test "$(stat -c %s "$p")" -eq 364814336
          echo '9789d6a9843d388034bc12341ad9a97585c25cb98cf11a0da8b768399b4842f6  '"$p" | sha256sum -c -
      - name: Extract read-only firmware into temporary workspace
        shell: bash
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/extract_official.py > "$RUNNER_TEMP/HB23_EXTRACT_PRIVATE.log"
      - name: Independently trace original eFuse and TEE calls
        shell: bash
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/tee_provision_stage22/audit_efuse_tee23.py \
            --firmware-root hasselblad_native_audit/firmware/extracted \
            --output "$RUNNER_TEMP/HB23_ORIGINAL_SAFE.json"
          python3 - "$RUNNER_TEMP/HB23_ORIGINAL_SAFE.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r["schema"]=="hasselblad-stage23-original-efuse-TEE-callgraph-v1"
          assert len(r["components"])==2
          assert r["TBIE_key_derived_or_recovered"] is False
          assert r["efuse_software_programming_or_execution_performed"] is False
          PY
      - name: Setup supported REA runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Setup Java21 for Ghidra 12.1.4
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install REA, AArch64 objdump, verified Ghidra
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu >/dev/null
          npm install -g --no-audit --no-fund rea-agents@latest > "$RUNNER_TEMP/HB23_NPM_PRIVATE.log" 2>&1
          mkdir -p "$RUNNER_TEMP/hbghidra"
          archive="$RUNNER_TEMP/hbghidra/ghidra_12.1.4_PUBLIC_20260921.zip"
          curl --fail --location --silent --show-error --retry 2 --retry-delay 5 --connect-timeout 25 --max-time 650 \
            'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip' --output "$archive"
          test "$(stat -c %s "$archive")" -eq 569649598
          echo "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  $archive" | sha256sum -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/hbghidra"
          rm -f "$archive"
          echo "GHIDRA_INSTALL_DIR=$RUNNER_TEMP/hbghidra/ghidra_12.1.4_PUBLIC" >> "$GITHUB_ENV"
          echo "REA_GHIDRA_STARTUP_TIMEOUT_MS=240000" >> "$GITHUB_ENV"
      - name: Verify original eFuse function with REA Ghidra and GNU objdump
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/HB23_ORIGINAL_SAFE.json" "$RUNNER_TEMP/HB23_REA_SAFE.json" <<'PY'
          import json,os,shutil,subprocess,sys
          from pathlib import Path
          data=json.loads(Path(sys.argv[1]).read_text())
          root=Path("hasselblad_native_audit/firmware/extracted")
          lib=root/"system/lib64/libamt_util.so"
          obj=shutil.which("aarch64-linux-gnu-objdump")
          env=os.environ.copy()
          env["REA_OBJDUMP_COMMAND"]=obj or ""
          out={"schema":"hasselblad-stage23-original-efuse-rea-ghidra-v1",
               "rea_available":bool(shutil.which("rea")),
               "ghidra_available":bool(os.environ.get("GHIDRA_INSTALL_DIR")),
               "provider":"ghidra_12.1.4_original_AArch64",
               "efuse_pro_ghidra_exit":None,
               "efuse_pro_json_parse_success":False,
               "efuse_pro_decompile_named_symbol":False,
               "efuse_pro_mentions_TEE_API":False,
               "efuse_pro_mentions_crypto_API":False,
               "gnu_objdump_json_parse_success":False,
               "secrets_or_original_decompilation_published":False,
               "encrypted_TA_decompiled":False}
          p=subprocess.run(["rea","decompile",str(lib),"efuse_pro",
             "--provider","ghidra","--format","json"],capture_output=True,env=env,timeout=400)
          out["efuse_pro_ghidra_exit"]=p.returncode
          if p.returncode==0:
              try:
                  q=json.loads(p.stdout)
                  out["efuse_pro_json_parse_success"]=isinstance(q,dict)
                  text=json.dumps(q,ensure_ascii=False)
                  out["efuse_pro_decompile_named_symbol"]="efuse_pro" in text
                  out["efuse_pro_mentions_TEE_API"]=any(x in text for x in ("TEEC_InvokeCommand","TEEC_OpenSession"))
                  out["efuse_pro_mentions_crypto_API"]=any(x in text for x in ("EVP_","sec_cipher_","AES_","SHA256_"))
              except (ValueError,UnicodeDecodeError):
                  pass
          q=subprocess.run(["rea","inspect-with-objdump",str(lib),"symbols",
             "--format","json"],capture_output=True,env=env,timeout=120)
          if q.returncode==0:
              try:out["gnu_objdump_json_parse_success"]=isinstance(json.loads(q.stdout),dict)
              except (ValueError,UnicodeDecodeError):pass
          Path(sys.argv[2]).write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps({"ghidra_result":out["efuse_pro_json_parse_success"],
                "objdump_result":out["gnu_objdump_json_parse_success"],
                "secrets_extracted":False},sort_keys=True))
          PY
      - name: Remove extracted originals and private analysis outputs
        if: always()
        shell: bash
        run: |
          rm -f hasselblad_native_audit/firmware/X2DII_100C_v1_3_16_2.cim
          rm -rf hasselblad_native_audit/firmware/extracted
          rm -rf "$RUNNER_TEMP/hbghidra"
          rm -f "$RUNNER_TEMP/HB23_PIP_PRIVATE.log" "$RUNNER_TEMP/HB23_EXTRACT_PRIVATE.log" "$RUNNER_TEMP/HB23_NPM_PRIVATE.log"
      - name: Publish bounded metadata receipts only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Hasselblad-REA-eFuse-TEE-Stage23-Safe
          path: |
            ${{ runner.temp }}/HB23_SYNTHETIC.json
            ${{ runner.temp }}/HB23_ORIGINAL_SAFE.json
            ${{ runner.temp }}/HB23_REA_SAFE.json
          if-no-files-found: error
          retention-days: 14
