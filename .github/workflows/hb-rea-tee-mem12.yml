name: Hasselblad REA TEE Memory Contract Stage12
"on":
  push:
    branches: [research/rea-tee-20261024]
    paths:
      - 'hasselblad_native_audit/tee_mem_stage12/**'
      - '.github/workflows/hb-rea-tee-mem12.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-original-tee-memrefs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out isolated research
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preflight code and original-free synthetic audit
        shell: bash
        run: |
          set -euo pipefail
          p=hasselblad_native_audit/tee_mem_stage12/inspect_memrefs12.py
          python3 -m py_compile "$p"
          python3 -m py_compile hasselblad_native_audit/tee_mem_stage12/inspect_input_chain13.py
          python3 -m py_compile hasselblad_native_audit/tee_mem_stage12/inspect_cfg_sources14.py
          python3 hasselblad_native_audit/tee_mem_stage12/inspect_cfg_sources14.py \
            --self-test --output "$RUNNER_TEMP/HB_REA14_SYNTHETIC.json"
          python3 hasselblad_native_audit/tee_mem_stage12/inspect_input_chain13.py \
            --self-test --output "$RUNNER_TEMP/HB_REA13_SYNTHETIC.json"
          python3 "$p" --self-test --output "$RUNNER_TEMP/HB_REA12_SYNTHETIC.json"
          python3 - "$RUNNER_TEMP/HB_REA12_SYNTHETIC.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["status"]=="PASS_synthetic" and d["checks"]==4
          PY
      - name: Install static-analysis and previous extraction dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'cryptography>=42,<47' 'brotli>=1.1,<2' 'dissect.extfs>=3,<4' 'pyelftools>=0.31,<1' 'capstone>=5,<6' > "$RUNNER_TEMP/HB12_PIP_PRIVATE.log" 2>&1
      - name: Install REA runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install REA and AArch64 GNU objdump
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq > /dev/null
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu > /dev/null
          npm install -g --no-audit --no-fund rea-agents@latest > "$RUNNER_TEMP/HB12_REA_PRIVATE.log" 2>&1
      - name: Fetch exact previous original X2D II firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hasselblad_native_audit/firmware
          p=hasselblad_native_audit/firmware/X2DII_100C_v1_3_16_2.cim
          curl --fail --location --silent --show-error --retry 3 --retry-delay 3 --connect-timeout 30 --max-time 600 'https://cdn.hasselblad.com/firmware/X2D_II_100C_Firmware/1.3.16.2/X2DII_100C_v1_3_16_2(1).cim' --output "$p"
          test "$(stat -c %s "$p")" -eq 364814336
          echo '9789d6a9843d388034bc12341ad9a97585c25cb98cf11a0da8b768399b4842f6  '"$p" | sha256sum -c -
      - name: Extract original system and vendor into ephemeral CI workspace
        shell: bash
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/extract_official.py > "$RUNNER_TEMP/HB12_EXTRACT_PRIVATE.log"
      - name: Original source-bound command 1/2/3/6 memory analysis
        shell: bash
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/tee_mem_stage12/inspect_memrefs12.py \
            --firmware-root hasselblad_native_audit/firmware/extracted \
            --output "$RUNNER_TEMP/HB_REA12_ORIGINAL_SAFE.json"
          python3 - "$RUNNER_TEMP/HB_REA12_ORIGINAL_SAFE.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["schema"]=="hasselblad-stage12-original-tee-memref-provenance-v1"
          assert len(d["functions"])==4
          assert d["AArch64_TEEC_struct_layout_assumed_not_proven"]
          assert d["TEE_or_DSP_decryption_performed"] is False
          assert d["data_includes_secret_key_or_plaintext"] is False
          PY
      - name: Trace original command6 input and version ABI to buffers
        shell: bash
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/tee_mem_stage12/inspect_input_chain13.py \
            --firmware-root hasselblad_native_audit/firmware/extracted \
            --output "$RUNNER_TEMP/HB_REA13_ORIGINAL_SAFE.json"
          python3 - "$RUNNER_TEMP/HB_REA13_ORIGINAL_SAFE.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["schema"]=="hasselblad-stage13-original-command6-input-provenance-v1"
          assert len(d["command6_copies"])==3 and len(d["command6_version_values"])==2
          assert not d["actual_key_selector_material_recovered"]
          assert not d["original_instruction_bytes_or_text_exported"]
          PY
      - name: Resolve original command6 pointer and version origins with AArch64 CFG
        shell: bash
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/tee_mem_stage12/inspect_cfg_sources14.py \
            --firmware-root hasselblad_native_audit/firmware/extracted \
            --output "$RUNNER_TEMP/HB_REA14_ORIGINAL_SAFE.json"
          python3 - "$RUNNER_TEMP/HB_REA14_ORIGINAL_SAFE.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r["schema"]=="hasselblad-stage14-original-command6-branch-reaching-definitions-v1"
          assert len(r["sites"])==5 and r["analyzed_instructions"]>50
          assert not r["key_values_or_decrypted_TA_or_DSP_recovered"]
          PY
      - name: REA inspect original host library with objdump provider
        shell: bash
        run: |
          set -euo pipefail
          export REA_OBJDUMP_COMMAND="$(command -v aarch64-linux-gnu-objdump)"
          file=hasselblad_native_audit/firmware/extracted/system/lib64/libfw_util_ca.so
          rea inspect-with-objdump "$file" symbols --format json > "$RUNNER_TEMP/HB12_REA_PRIVATE_OUTPUT.json"
          python3 - "$RUNNER_TEMP/HB12_REA_PRIVATE_OUTPUT.json" "$RUNNER_TEMP/HB_REA12_EXECUTION_SAFE.json" <<'PY'
          import json,sys
          from pathlib import Path
          j=json.loads(Path(sys.argv[1]).read_text())
          assert isinstance(j,dict)
          Path(sys.argv[2]).write_text(json.dumps({
             "original_AArch64_elf":True,"rea_provider":"GNU_objdump",
             "rea_output_json_parsed":True,"secure_world_executable_decompiled":False,
             "keys_or_original_instructions_exported":False},indent=2)+"\n")
          PY
          rm -f "$RUNNER_TEMP/HB12_REA_PRIVATE_OUTPUT.json"
      - name: Clean all vendor binaries and private logs
        if: always()
        shell: bash
        run: |
          rm -f hasselblad_native_audit/firmware/X2DII_100C_v1_3_16_2.cim
          rm -rf hasselblad_native_audit/firmware/extracted
          rm -f "$RUNNER_TEMP/HB12_EXTRACT_PRIVATE.log" "$RUNNER_TEMP/HB12_PIP_PRIVATE.log" "$RUNNER_TEMP/HB12_REA_PRIVATE.log" "$RUNNER_TEMP/HB12_REA_PRIVATE_OUTPUT.json"
      - name: Publish bounded reports only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Hasselblad-REA-TEE-Memrefs-Stage12-Safe
          path: |
            ${{ runner.temp }}/HB_REA12_SYNTHETIC.json
            ${{ runner.temp }}/HB_REA12_ORIGINAL_SAFE.json
            ${{ runner.temp }}/HB_REA12_EXECUTION_SAFE.json
            ${{ runner.temp }}/HB_REA13_SYNTHETIC.json
            ${{ runner.temp }}/HB_REA13_ORIGINAL_SAFE.json
            ${{ runner.temp }}/HB_REA14_SYNTHETIC.json
            ${{ runner.temp }}/HB_REA14_ORIGINAL_SAFE.json
          if-no-files-found: error
          retention-days: 14
