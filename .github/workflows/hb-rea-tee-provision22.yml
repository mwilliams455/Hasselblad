name: Hasselblad TEE key-provisioning evidence — Stage22
"on":
  push:
    branches: [research/rea-tee-20261024]
    paths:
      - 'hasselblad_native_audit/tee_provision_stage22/**'
      - '.github/workflows/hb-rea-tee-provision22.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-original-key-provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout isolated research sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Synthetic preflight before original firmware download
        shell: bash
        run: |
          set -euo pipefail
          p=hasselblad_native_audit/tee_provision_stage22/audit_key_provisioning22.py
          python3 -m py_compile "$p"
          python3 -m py_compile hasselblad_native_audit/tee_provision_stage22/trace_efuse_session24.py
          python3 -m py_compile hasselblad_native_audit/tee_provision_stage22/trace_stack_uuid25.py
          python3 hasselblad_native_audit/tee_provision_stage22/trace_stack_uuid25.py \
            --self-test --output "$RUNNER_TEMP/HB25_SYNTHETIC.json"
          python3 hasselblad_native_audit/tee_provision_stage22/trace_efuse_session24.py \
            --self-test --output "$RUNNER_TEMP/HB24_SYNTHETIC.json"
          python3 "$p" --self-test --output "$RUNNER_TEMP/HB22_SYNTHETIC.json"
          python3 - "$RUNNER_TEMP/HB22_SYNTHETIC.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["status"]=="PASS_synthetic" and x["checks"]==6
          PY
      - name: Install extraction and pyelftools dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'cryptography>=42,<47' 'brotli>=1.1,<2' 'dissect.extfs>=3,<4' 'pyelftools>=0.31,<1' 'capstone>=5,<6' > "$RUNNER_TEMP/HB22_PIP_PRIVATE.log" 2>&1
      - name: Verify original X2D II OTA download without storing in repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hasselblad_native_audit/firmware
          p=hasselblad_native_audit/firmware/X2DII_100C_v1_3_16_2.cim
          curl --fail --location --silent --show-error --retry 3 --retry-delay 3 --connect-timeout 30 --max-time 600 'https://cdn.hasselblad.com/firmware/X2D_II_100C_Firmware/1.3.16.2/X2DII_100C_v1_3_16_2(1).cim' --output "$p"
          test "$(stat -c %s "$p")" -eq 364814336
          echo '9789d6a9843d388034bc12341ad9a97585c25cb98cf11a0da8b768399b4842f6  '"$p" | sha256sum -c -
      - name: Extract original system and vendor privately, no execution
        shell: bash
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/extract_official.py > "$RUNNER_TEMP/HB22_EXTRACT_PRIVATE.log"
      - name: Audit original firmware for normal-world key-provisioning traces
        shell: bash
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/tee_provision_stage22/audit_key_provisioning22.py \
            --firmware-root hasselblad_native_audit/firmware/extracted \
            --output "$RUNNER_TEMP/HB22_ORIGINAL_SAFE.json"
          python3 - "$RUNNER_TEMP/HB22_ORIGINAL_SAFE.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["schema"]=="hasselblad-stage22-original-key-provisioning-surface-v1"
          assert x["files_scanned"]>1000
          assert not x["cryptographic_keys_found_or_exported"]
          assert not x["original_vendor_code_executed"]
          assert not x["vendor_instruction_bytes_or_private_strings_exported"]
          PY
      - name: Trace original eFuse secure-session UUID and command argument
        shell: bash
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/tee_provision_stage22/trace_efuse_session24.py \
            --firmware-root hasselblad_native_audit/firmware/extracted \
            --output "$RUNNER_TEMP/HB24_ORIGINAL_SAFE.json"
          python3 - "$RUNNER_TEMP/HB24_ORIGINAL_SAFE.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["schema"]=="hasselblad-stage24-original-efuse-TEE-session-UUID-v1"
          assert len(d["resolved_relevant_tee_calls"])>=2
          assert not d["known_key_material_extracted"]
          assert not d["eFuse_function_executed"]
          assert not d["vendor_machine_code_or_decompilation_exported"]
          PY
      - name: Compare original eFuse session stack-UUID construction with protected TA identity
        shell: bash
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/tee_provision_stage22/trace_stack_uuid25.py \
            --firmware-root hasselblad_native_audit/firmware/extracted \
            --output "$RUNNER_TEMP/HB25_ORIGINAL_SAFE.json"
          python3 - "$RUNNER_TEMP/HB25_ORIGINAL_SAFE.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["schema"]=="hasselblad-stage25-original-efuse-stack-uuid-derivation-v1"
          assert len(d["static_results"])>=2
          assert d["encrypted_DSP_or_TA_decrypted"] is False
          assert d["unknown_literal_bytes_or_secret_key_material_exported"] is False
          PY
      - name: Setup REA supported runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install REA and original AArch64 binary analysis tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu >/dev/null
          npm install -g --no-audit --no-fund rea-agents@latest > "$RUNNER_TEMP/HB22_REA_INSTALL_PRIVATE.log" 2>&1
      - name: Run REA on newly identified readable hardware-key candidates only
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/HB22_ORIGINAL_SAFE.json" "$RUNNER_TEMP/HB22_REA_SAFE.json" <<'PY'
          from pathlib import Path
          import json,os,shutil,subprocess,sys
          x=json.loads(Path(sys.argv[1]).read_text())
          prefix=Path("hasselblad_native_audit/firmware/extracted")
          candidate=[z for z in x["file_rows"]
             if z.get("format")=="ELF" and
                set(z["marker_families"]) & {"cryptocell","arm_cc_family","efuse",
                    "otp","key_ladder","root_key","secure_crypto_device","key_derivation_api"}]
          report={"schema":"hasselblad-rea-stage22-original-provider-probe-v1",
              "candidate_elfs_with_hardware_key_markers":len(candidate),
              "rea_cli_available":bool(shutil.which("rea")),
              "original_elf_probes":[],"protected_TA_decompiled":False,
              "secret_key_or_vendor_bytes_exported":False}
          rea=shutil.which("rea")
          obj=shutil.which("aarch64-linux-gnu-objdump")
          if rea and obj:
              for cand in candidate[:4]:
                  f=prefix/cand["path"]
                  env=os.environ.copy();env["REA_OBJDUMP_COMMAND"]=obj
                  z={"path":cand["path"],"provider":"GNU_objdump","json_valid":False}
                  try:
                      p=subprocess.run([rea,"inspect-with-objdump",str(f),"symbols",
                        "--format","json"],capture_output=True,env=env,timeout=90)
                      if p.returncode==0:
                          try:z["json_valid"]=isinstance(json.loads(p.stdout),dict)
                          except (ValueError,UnicodeDecodeError):pass
                      z["returncode"]=p.returncode
                  except (OSError,subprocess.TimeoutExpired) as e:
                      z["error_class"]=type(e).__name__
                  report["original_elf_probes"].append(z)
          Path(sys.argv[2]).write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print(json.dumps({"original_candidate_count":len(candidate),
              "REA_successes":sum(int(z["json_valid"]) for z in report["original_elf_probes"])},
              sort_keys=True))
          PY
      - name: Remove private original firmware and native-tool logs
        if: always()
        shell: bash
        run: |
          rm -f hasselblad_native_audit/firmware/X2DII_100C_v1_3_16_2.cim
          rm -rf hasselblad_native_audit/firmware/extracted
          rm -f "$RUNNER_TEMP/HB22_PIP_PRIVATE.log" "$RUNNER_TEMP/HB22_EXTRACT_PRIVATE.log" "$RUNNER_TEMP/HB22_REA_INSTALL_PRIVATE.log"
      - name: Store bounded metadata receipts only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Hasselblad-REA-Key-Provisioning-Stage22-Safe
          path: |
            ${{ runner.temp }}/HB22_SYNTHETIC.json
            ${{ runner.temp }}/HB22_ORIGINAL_SAFE.json
            ${{ runner.temp }}/HB22_REA_SAFE.json
            ${{ runner.temp }}/HB24_SYNTHETIC.json
            ${{ runner.temp }}/HB24_ORIGINAL_SAFE.json
            ${{ runner.temp }}/HB25_SYNTHETIC.json
            ${{ runner.temp }}/HB25_ORIGINAL_SAFE.json
          if-no-files-found: error
          retention-days: 14
