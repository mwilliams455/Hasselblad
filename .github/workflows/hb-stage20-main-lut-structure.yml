name: Hasselblad Stage20 original MAIN/LCDC LUT spatial structure (research only)

'on':
  push:
    branches:
      - recovery/awb-rebuild-20261021
    paths:
      - 'hasselblad_native_audit/isp_main_stage20/**'
      - '.github/workflows/hb-stage20-main-lut-structure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-iq-spatial-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout trusted research source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Guard phone renderer and pinned upstream research
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet 2a2df186db91e1993283d400a7df4c61d77af4df HEAD -- \
            HasselbladPhoton/app \
            hasselblad_native_audit/photographic_path \
            hasselblad_native_audit/photographic_pixel_stage9 \
            hasselblad_native_audit/photographic_profile_stage8 \
            hasselblad_native_audit/isp_research_stage14 \
            hasselblad_native_audit/isp_dng_stage18 \
            hasselblad_native_audit/isp_colour_stage19
          test "$(git ls-files 'hasselblad_native_audit/firmware/*.cim' | wc -l)" -eq 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install inert source parsing packages
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy>=2.0,<3' 'cryptography>=42,<47' 'brotli>=1.1,<2' 'dissect.extfs>=3,<4'
      - name: Validate independent hypothetical formats with adversarial synthetic fixtures
        run: |
          set -euo pipefail
          python hasselblad_native_audit/isp_main_stage20/src/main_lut_spatial_audit.py --self-test
      - name: Download only hash-verified official X2D II firmware into temporary workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hasselblad_native_audit/firmware
          firmware='hasselblad_native_audit/firmware/X2DII_100C_v1_3_16_2.cim'
          curl --fail --location --retry 2 --retry-delay 4 --connect-timeout 25 --max-time 520 \
            --silent --show-error \
            'https://cdn.hasselblad.com/firmware/X2D_II_100C_Firmware/1.3.16.2/X2DII_100C_v1_3_16_2(1).cim' \
            --output "$firmware"
          test "$(stat -c %s "$firmware")" -eq 364814336
          echo '9789d6a9843d388034bc12341ad9a97585c25cb98cf11a0da8b768399b4842f6  '"$firmware" | sha256sum -c -
      - name: Extract original camera IQ as transient inert research data
        shell: bash
        run: |
          set -euo pipefail
          python hasselblad_native_audit/extract_official.py > "$RUNNER_TEMP/hb20-extraction-internal.log"
      - name: Rank spatial format hypotheses on original MAIN and LCDC payloads (not a pixel oracle)
        shell: bash
        run: |
          set -euo pipefail
          python hasselblad_native_audit/isp_main_stage20/src/main_lut_spatial_audit.py \
            --original-root 'hasselblad_native_audit/firmware/extracted' \
            --output "$RUNNER_TEMP/HB20_PUBLIC_SPATIAL_SCORES.json"
          python - "$RUNNER_TEMP/HB20_PUBLIC_SPATIAL_SCORES.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          assert j['status']=='PASS_original_X2D_IQ_structural_audit'
          assert j['candidate_model_count']==72 and j['profile_size_words']==6144
          assert j['MAIN_pixel_layout_proven'] is False
          assert j['MAIN_pixel_sampler_proven'] is False
          assert j['vendor_code_executed'] is False and j['source_bytes_exported'] is False
          assert j['render_applied'] is False
          assert j['candidate_families_are_not_exhaustive'] is True
          assert set(j['results'])=={'main_3dlut','lcdc_3dlut0','lcdc_3dlut1'}
          for asset_name,aggregate in j['unique_content_aggregate_summary'].items():
              assert aggregate['stored_profiles']==8 and aggregate['unique_profile_contents']==6
              assert aggregate['canonical_RGB_axis_or_bank_order_proven'] is False
              assert aggregate['Stage9_original_DISPLAY_canonical_decode_in_best_equivalence_class_count']==8
              assert aggregate['planar_family_lower_heuristic_count']==8
              assert aggregate['mean_interleaved_to_planar_score_ratio']>4.0
          for asset in j['results'].values():
              assert len(asset['profiles'])==8
              for p in asset['profiles']:
                  assert p['models_examined']==72
                  assert p['top_equivalence_class_size']>=1
          print('PASS original IQ structure, provenance, 72 format hypotheses, no pixel-oracle claim')
          PY
      - name: Safety-check metadata receipt
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/HB20_PUBLIC_SPATIAL_SCORES.json" <<'PY'
          import json,sys
          text=open(sys.argv[1]).read(); j=json.loads(text)
          for prohibited in ('pixel_rgb_values','camera_lut_words','vendor_payload_hex','IMG_2026','/mnt/data'):
              assert prohibited not in text, prohibited
          assert j['camera_data_or_photo_exported'] is False
          assert j['phone_colour_still_Photon'] is True
          PY
      - name: Upload derived aggregate scores only — NO original LUT bytes
        uses: actions/upload-artifact@v4
        with:
          name: Hasselblad-Stage20-MAIN-LCDC-Structure-Scores
          path: ${{ runner.temp }}/HB20_PUBLIC_SPATIAL_SCORES.json
          retention-days: 7
          if-no-files-found: error
