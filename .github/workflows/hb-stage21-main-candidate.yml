name: Hasselblad Stage21 MAIN 3D LUT offline candidate research

'on':
  push:
    branches:
      - recovery/awb-rebuild-20261021
    paths:
      - 'hasselblad_native_audit/isp_main_stage21/**'
      - '.github/workflows/hb-stage21-main-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HB_STAGE8_C: hasselblad_native_audit/photographic_profile_stage8/src/hb_main_lut_profile.c
      HB_STAGE9_C: hasselblad_native_audit/photographic_pixel_stage9/src/hb_display_lut16.c
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Protect production source and previous colour mathematics
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet ce7c82b4d3b2727067ca99b51ce6b9fd3ab4b9d0 HEAD -- \
            HasselbladPhoton/app \
            hasselblad_native_audit/photographic_path \
            hasselblad_native_audit/photographic_profile_stage8 \
            hasselblad_native_audit/photographic_pixel_stage9 \
            hasselblad_native_audit/isp_research_stage14 \
            hasselblad_native_audit/isp_dng_stage18 \
            hasselblad_native_audit/isp_colour_stage19 \
            hasselblad_native_audit/isp_main_stage20
          test "$(git ls-files 'hasselblad_native_audit/firmware/*.cim' | wc -l)" -eq 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent reference and audited archive parser dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy>=2,<3' 'cryptography>=42,<47' 'brotli>=1.1,<2' 'dissect.extfs>=3,<4'
      - name: Verify both candidate interpolation methods against independent NumPy and DISPLAY reference
        run: |
          set -euo pipefail
          python hasselblad_native_audit/isp_main_stage21/tests/test_candidate21.py \
             --cc gcc --opt=-O2 --output "$RUNNER_TEMP/STAGE21_SYNTHETIC_GCC.json"
          python hasselblad_native_audit/isp_main_stage21/tests/test_candidate21.py \
             --cc clang --opt=-O0 --output "$RUNNER_TEMP/STAGE21_SYNTHETIC_CLANG.json"
      - name: Test invalid inputs, output integrity and no implicit clipping with sanitizers
        shell: bash
        run: |
          set -euo pipefail
          clang -std=c11 -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined \
            -Wall -Wextra -Werror \
            -I hasselblad_native_audit/isp_main_stage21/src \
            hasselblad_native_audit/isp_main_stage21/src/hb_main_candidate21.c \
            hasselblad_native_audit/isp_main_stage21/tests/test_candidate21_sanitized.c \
            -lm -o "$RUNNER_TEMP/stage21_asan"
          "$RUNNER_TEMP/stage21_asan"
      - name: Retrieve exact X2D II 1.3.16.2 official firmware into ephemeral runner only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hasselblad_native_audit/firmware
          firmware=hasselblad_native_audit/firmware/X2DII_100C_v1_3_16_2.cim
          curl --fail --location --retry 2 --retry-delay 4 --connect-timeout 25 --max-time 520 \
            --silent --show-error \
            'https://cdn.hasselblad.com/firmware/X2D_II_100C_Firmware/1.3.16.2/X2DII_100C_v1_3_16_2(1).cim' \
            --output "$firmware"
          test "$(stat -c %s "$firmware")" -eq 364814336
          echo '9789d6a9843d388034bc12341ad9a97585c25cb98cf11a0da8b768399b4842f6  '"$firmware" | sha256sum -c -
      - name: Extract official IQ assets transiently (no vendor binary execution)
        shell: bash
        run: |
          set -euo pipefail
          python hasselblad_native_audit/extract_official.py > "$RUNNER_TEMP/stage21_extraction_internal.txt"
      - name: Evaluate original MAIN profile sensitivity to two hypothetical pixel samplers
        shell: bash
        run: |
          set -euo pipefail
          python hasselblad_native_audit/isp_main_stage21/src/original_candidate_probe21.py \
            --original-root hasselblad_native_audit/firmware/extracted \
            --output "$RUNNER_TEMP/STAGE21_PUBLIC_ORIGINAL_AGGREGATES.json"
          python - "$RUNNER_TEMP/STAGE21_PUBLIC_ORIGINAL_AGGREGATES.json" <<'PY'
          import json,sys
          p=sys.argv[1];text=open(p).read();d=json.loads(text)
          assert d['status']=='PASS_original_X2D_II_asset_candidate_experiment'
          assert d['prepared_conditions_tested']==12
          assert d['original_native_reference_preparation_hashes_verified']==10
          assert d['warm_2400_and_3050_equivalence_for_each_gamut'] is True
          assert len(d['six_equal_structural_RGB_relabeling_options'])==6
          assert all(x['candidate_C_vs_numpy_max']<=3e-15 for x in d['per_condition_aggregates'].values())
          assert d['photographic_render_authorized'] is False
          assert d['original_ISP_pixel_output_oracle_available'] is False
          assert d['original_vendor_table_values_exported'] is False
          assert d['real_X2D_II_photograph_or_Phocus_target_used'] is False
          assert d['render_applied'] is False
          for dangerous in ['61254(1).dng','IMG_2026','full_vendor_table','rgb_vertices','lut_word_values','/mnt/data','photographic_render_authorized": true']:
              assert dangerous not in text, dangerous
          print('PASS: 12 original-profile conditions, 10 archived native hashes, six RGB permutations, no MAIN hardware claim')
          PY
      - name: Upload aggregated numerical evidence only, never original tuning or photographs
        uses: actions/upload-artifact@v4
        with:
          name: Hasselblad-Stage21-MAIN-LUT-Candidate-Only
          path: |
            ${{ runner.temp }}/STAGE21_SYNTHETIC_GCC.json
            ${{ runner.temp }}/STAGE21_SYNTHETIC_CLANG.json
            ${{ runner.temp }}/STAGE21_PUBLIC_ORIGINAL_AGGREGATES.json
          retention-days: 7
          if-no-files-found: error
