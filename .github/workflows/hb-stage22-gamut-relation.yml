name: Hasselblad Stage22 original MAIN sRGB P3 bank relation (research only)

'on':
  push:
    branches:
      - recovery/awb-rebuild-20261021
    paths:
      - 'hasselblad_native_audit/isp_main_stage22/**'
      - '.github/workflows/hb-stage22-gamut-relation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-bank-hypotheses:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Guard production and prior mathematics unmodified
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet e5b6aad6ff6c4f063e6b0262123d589ffa0beb60 HEAD -- \
            HasselbladPhoton/app \
            hasselblad_native_audit/photographic_path \
            hasselblad_native_audit/photographic_profile_stage8 \
            hasselblad_native_audit/photographic_pixel_stage9 \
            hasselblad_native_audit/isp_research_stage14 \
            hasselblad_native_audit/isp_dng_stage18 \
            hasselblad_native_audit/isp_colour_stage19 \
            hasselblad_native_audit/isp_main_stage20 \
            hasselblad_native_audit/isp_main_stage21
          test "$(git ls-files 'hasselblad_native_audit/firmware/*.cim' | wc -l)" -eq 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numeric and hash-pinned firmware parsing dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'numpy>=2,<3' 'cryptography>=42,<47' 'brotli>=1.1,<2' 'dissect.extfs>=3,<4'
      - name: Run two-compilers synthetic colour-space and ambiguity controls
        shell: bash
        run: |
          set -euo pipefail
          python hasselblad_native_audit/isp_main_stage22/src/gamut_relation22.py \
            --selftest --cc gcc --output "$RUNNER_TEMP/STAGE22_SYNTHETIC_GCC.json"
          python hasselblad_native_audit/isp_main_stage22/src/gamut_relation22.py \
            --selftest --cc clang --output "$RUNNER_TEMP/STAGE22_SYNTHETIC_CLANG.json"
          python - "$RUNNER_TEMP/STAGE22_SYNTHETIC_GCC.json" "$RUNNER_TEMP/STAGE22_SYNTHETIC_CLANG.json" <<'PY'
          import json,sys
          for p in sys.argv[1:]:
              a=json.load(open(p))
              assert a['status']=='PASS'
              assert a['standard_primaries_vs_stage19_bridge_max_error']<3e-14
              assert a['linear_known_bank_winner']=='201'
              assert a['encoded_transfer_control_winner']=='encoded_standard_gamut'
              assert a['identity_negative_control_winner']=='identity'
              assert a['full_grid_axis_permutations_proven_score_invariant']==6
              assert a['monochrome_equal_bank_ambiguity_confirmed']
              assert a['photographic_render_authorized'] is False
          print('PASS: standard primaries, both transfer controls, exact axis non-identifiability')
          PY
      - name: Retrieve original X2D II 1.3.16.2 camera firmware into ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hasselblad_native_audit/firmware
          firmware=hasselblad_native_audit/firmware/X2DII_100C_v1_3_16_2.cim
          curl --fail --location --retry 2 --retry-delay 4 --connect-timeout 25 \
            --max-time 520 --silent --show-error \
            'https://cdn.hasselblad.com/firmware/X2D_II_100C_Firmware/1.3.16.2/X2DII_100C_v1_3_16_2(1).cim' \
            --output "$firmware"
          test "$(stat -c %s "$firmware")" -eq 364814336
          echo '9789d6a9843d388034bc12341ad9a97585c25cb98cf11a0da8b768399b4842f6  '"$firmware" | sha256sum -c -
      - name: Extract original camera IQ transiently; no binary execution
        shell: bash
        run: |
          set -euo pipefail
          python hasselblad_native_audit/extract_official.py > "$RUNNER_TEMP/STAGE22_EXTRACTION_PRIVATE.txt"
      - name: Calculate MAIN sRGB/P3 relation hypotheses at genuine table grid nodes
        shell: bash
        run: |
          set -euo pipefail
          python hasselblad_native_audit/isp_main_stage22/src/gamut_relation22.py \
            --original-root hasselblad_native_audit/firmware/extracted \
            --cc gcc --output "$RUNNER_TEMP/STAGE22_SAFE_ORIGINAL_GAMUT_SUMMARY.json"
          python - "$RUNNER_TEMP/STAGE22_SAFE_ORIGINAL_GAMUT_SUMMARY.json" <<'PY'
          import json,sys
          text=open(sys.argv[1]).read();a=json.loads(text)
          assert a['status']=='PASS_original_source_gamut_relation_diagnostic'
          assert a['original_native_prepared_profile_hashes_verified']==10
          assert a['synthetic_full_grid_points_per_gamut']==4096
          assert len(a['results_by_kelvin'])==5
          assert a['input_axis_order_unidentifiable_by_full_grid_relabelling'] is True
          assert a['main_pixel_sampler_validated'] is False
          assert a['photographic_render_authorized'] is False
          assert a['vendor_tuning_payload_exported'] is False
          assert a['original_pixel_values_exported'] is False
          for key,v in a['results_by_kelvin'].items():
              assert v['hypotheses_tested']==18
              assert len(v['by_bank_order'])==6
              assert set(v['per_hypothesis_best'])=={'identity','linear_standard_gamut','encoded_standard_gamut'}
              assert all(row['output_bank_order_hardware_proven'] is False for row in [v])
          for secret in ['/mnt/data','IMG_2026','grid_RGB_samples','source_lut_words','photographic_render_authorized": true']:
              assert secret not in text, 'potential sensitive data in artifact'
          print('PASS: ten native hash anchors, 5 temperatures, 6 bank maps x 3 transfer models; no photographic claim')
          PY
      - name: Upload aggregate-only source-independent verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: Hasselblad-Stage22-Gamut-Relation-Math-Only
          path: |
            ${{ runner.temp }}/STAGE22_SYNTHETIC_GCC.json
            ${{ runner.temp }}/STAGE22_SYNTHETIC_CLANG.json
            ${{ runner.temp }}/STAGE22_SAFE_ORIGINAL_GAMUT_SUMMARY.json
          retention-days: 7
          if-no-files-found: error
