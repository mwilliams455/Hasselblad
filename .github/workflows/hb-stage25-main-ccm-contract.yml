name: Hasselblad Stage25 MAIN CCM descriptor-driver contract

'on':
  push:
    branches:
      - recovery/awb-rebuild-20261021
    paths:
      - 'hasselblad_native_audit/isp_main_stage25/**'
      - '.github/workflows/hb-stage25-main-ccm-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main-ccm-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded static-analysis dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'cryptography>=42,<47' 'brotli>=1.1,<2' 'dissect.extfs>=3,<4' \
            'pyelftools>=0.31,<1' 'capstone>=5,<6'
      - name: Synthetic descriptor-family join checks
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/isp_main_stage25/inspect_main_ccm_contract25.py --self-test
      - name: Retrieve exact X2D II 1.3.16.2 firmware transiently
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hasselblad_native_audit/firmware
          firmware='hasselblad_native_audit/firmware/X2DII_100C_v1_3_16_2.cim'
          curl --fail --location --retry 2 --retry-delay 4 --connect-timeout 25 --max-time 520 \
            --silent --show-error \
            'https://cdn.hasselblad.com/firmware/X2D_II_100C_Firmware/1.3.16.2/X2DII_100C_v1_3_16_2(1).cim' \
            --output "$firmware"
          test "$(stat -c %s "$firmware")" -eq 364814336
          echo '9789d6a9843d388034bc12341ad9a97585c25cb98cf11a0da8b768399b4842f6  '"$firmware" | sha256sum -c -
      - name: Extract exact firmware in ephemeral runner
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/extract_official.py > "$RUNNER_TEMP/STAGE25_PRIVATE_EXTRACTION.log"
      - name: Join original MAIN CCM descriptor names to driver ranges
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/isp_main_stage25/inspect_main_ccm_contract25.py \
            --repo-root . \
            --firmware-root hasselblad_native_audit/firmware/extracted \
            --output "$RUNNER_TEMP/STAGE25_MAIN_CCM_CONTRACT.json"
          python3 - "$RUNNER_TEMP/STAGE25_MAIN_CCM_CONTRACT.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['status']=='PASS_exact_source_descriptor_driver_join'
          assert d['parameter_count']==27
          assert d['lmtx_fw']['register_groups']==16
          assert d['lmtx_fw']['coefficients_per_group']==6
          assert d['lmtx_fw']['pixel_equation_proven'] is False
          assert d['six_coefficient_candidate_review']['neutral_preserving_constrained_3x3_hypothesis_promoted'] is False
          assert d['vendor_tuning_values_exported'] is False
          assert d['vendor_instruction_bytes_exported'] is False
          assert d['photographic_render_authorized'] is False
          assert d['production_phone_renderer_modified'] is False
          print(json.dumps({'status':'PASS','parameters':d['parameter_count'],'lmtx_pixel_equation_proven':False}))
          PY
      - name: Public artifact privacy and scope guard
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/STAGE25_MAIN_CCM_CONTRACT.json"
          test -s "$report"
          python3 - "$report" <<'PY'
          import json,pathlib,sys
          p=pathlib.Path(sys.argv[1]); text=p.read_text(); d=json.loads(text)
          forbidden=['coefficient_values','vendor_instruction_bytes_base64','raw_pixels','photograph_path']
          assert not any(x in text for x in forbidden)
          assert d['pixel_samples_processed'] is False
          assert d['vendor_tuning_values_exported'] is False
          PY
          rm -f hasselblad_native_audit/firmware/X2DII_100C_v1_3_16_2.cim
          rm -rf hasselblad_native_audit/firmware/extracted
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Upload sanitized evidence only
        uses: actions/upload-artifact@v4
        with:
          name: Hasselblad-Stage25-MAIN-CCM-Contract-Safe
          path: ${{ runner.temp }}/STAGE25_MAIN_CCM_CONTRACT.json
          if-no-files-found: error
          retention-days: 14
