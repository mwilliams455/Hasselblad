name: Hasselblad Stage28 exact Eagle2 CCM entrypoint audit

"on":
  push:
    branches:
      - recovery/awb-rebuild-20261021
    paths:
      - 'hasselblad_native_audit/isp_main_stage28/**'
      - '.github/workflows/hb-stage28-main-ccm-entrypoints.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main-ccm-entrypoints:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Read-only checkout of original research branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prevent modifications to production Photon camera files
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only 2f41f06e82bd71202bbf8bd02ca9a8c1190fd732 HEAD -- HasselbladPhoton)"
          python3 -m py_compile hasselblad_native_audit/isp_main_stage28/inspect_ccm_entrypoints28.py
          python3 -m py_compile hasselblad_native_audit/isp_main_stage28/inspect_format_boundary28b.py
      - name: Test relocations, targets and function containment on synthetic controls
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/isp_main_stage28/inspect_ccm_entrypoints28.py             --self-test --output "$RUNNER_TEMP/STAGE28_SYNTHETIC.json"
          python3 hasselblad_native_audit/isp_main_stage28/inspect_format_boundary28b.py --self-test --output "$RUNNER_TEMP/STAGE28B_SYNTHETIC.json"
      - name: Install pinned original firmware extraction and ELF analysis tools
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check             'cryptography>=42,<47' 'brotli>=1.1,<2' 'dissect.extfs>=3,<4'             'pyelftools>=0.31,<1' 'capstone>=5,<6'
      - name: Fetch official X2D II 100C 1.3.16.2 transiently
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hasselblad_native_audit/firmware
          firmware=hasselblad_native_audit/firmware/X2DII_100C_v1_3_16_2.cim
          curl --fail --location --retry 2 --retry-delay 4 --connect-timeout 25 --max-time 520             --silent --show-error             'https://cdn.hasselblad.com/firmware/X2D_II_100C_Firmware/1.3.16.2/X2DII_100C_v1_3_16_2(1).cim'             --output "$firmware"
          test "$(stat -c %s "$firmware")" -eq 364814336
          echo '9789d6a9843d388034bc12341ad9a97585c25cb98cf11a0da8b768399b4842f6  '"$firmware" | sha256sum -c -
      - name: Extract exact firmware into private transient workspace
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/extract_official.py > "$RUNNER_TEMP/STAGE28_PRIVATE_EXTRACTION.log"
      - name: Inspect original CCM kernel relocation relationships
        shell: bash
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/isp_main_stage28/inspect_ccm_entrypoints28.py             --module hasselblad_native_audit/firmware/extracted/system/lib/modules/vcam_driver.ko             --prior hasselblad_native_audit/main_colour_20261019/ccm/ccm_driver_evidence.json             --output "$RUNNER_TEMP/STAGE28_CCM_ENTRYPOINTS.json"
          python3 hasselblad_native_audit/isp_main_stage28/inspect_format_boundary28b.py --module hasselblad_native_audit/firmware/extracted/system/lib/modules/vcam_driver.ko --output "$RUNNER_TEMP/STAGE28B_B2R_CCM_FORMAT.json"
          python3 - "$RUNNER_TEMP/STAGE28_CCM_ENTRYPOINTS.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['status']=='PASS_exact_source_entrypoint_metadata'
          assert d['platform']=='Eagle2' and d['elf_machine']=='EM_AARCH64'
          assert d['targets']['ccm_set_fn0_config']['relocation_count']>=1
          assert d['source_callers_are_section_relative_not_live_addresses'] is True
          assert d['six_coefficient_pixel_formula_proven'] is False
          assert d['coefficient_Q_scale_proven'] is False
          assert d['camera_saved_photo_render_authorized'] is False
          assert d['vendor_tuning_values_exported'] is False
          assert d['vendor_instruction_bytes_exported'] is False
          assert d['phone_renderer_modified'] is False
          print(json.dumps({'status':d['status'],
                'ccm_named_function_count':d['ccm_named_function_count'],
                'call_references':{k:v['relocation_count'] for k,v in d['targets'].items()},
                'actual_pixel_equation_recovered':False}))
          PY
          python3 - "$RUNNER_TEMP/STAGE28B_B2R_CCM_FORMAT.json" <<'PY_FORMAT'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['status']=='PASS_original_B2R_to_CCM_format_edge'
          assert d['ccm_format_callsite_hex']=='0x6d598'
          assert 'ccm_set_fmt' in d['b2r_callees_named']
          assert d['six_coefficient_pixel_formula_proven'] is False
          assert d['format_values_and_pixel_domain_recovered'] is False
          assert d['vendor_instruction_bytes_exported'] is False
          assert d['android_saved_JPEG_unchanged'] is True
          print(json.dumps({'status':d['status'],'b2r_callees':d['b2r_callees_named'],
            'ig0_named_incoming_relocations':d['ig0_named_incoming_relocations'],
            'ig0_section_references':len(d['ig0_exact_section_plus_addend_relocations']),
            'original_pixel_formula_proven':False}))
          PY_FORMAT
      - name: Verify public artifact boundaries and remove firmware
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/STAGE28_CCM_ENTRYPOINTS.json" <<'PY'
          import json,pathlib,sys
          p=pathlib.Path(sys.argv[1]);d=json.loads(p.read_text())
          assert 'firmware_binary' not in d and 'coefficient_values' not in d
          assert 'instruction_hex' not in d and 'rgb_pixels' not in d
          assert d['no_original_rgb_pixels_evaluated'] is True
          PY
          python3 - "$RUNNER_TEMP/STAGE28B_B2R_CCM_FORMAT.json" <<'PY_BOUND'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert 'firmware_bytes' not in d and 'coefficient_values' not in d
          assert d['hardware_ISP_not_emulated'] is True
          PY_BOUND
          rm -f hasselblad_native_audit/firmware/X2DII_100C_v1_3_16_2.cim
          rm -rf hasselblad_native_audit/firmware/extracted
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Upload metadata-only findings and synthetic tests
        uses: actions/upload-artifact@v4
        with:
          name: Hasselblad-Stage28-CCM-EntryPoints-Safe
          path: |
            ${{ runner.temp }}/STAGE28_CCM_ENTRYPOINTS.json
            ${{ runner.temp }}/STAGE28_SYNTHETIC.json
            ${{ runner.temp }}/STAGE28B_B2R_CCM_FORMAT.json
            ${{ runner.temp }}/STAGE28B_SYNTHETIC.json
          if-no-files-found: error
          retention-days: 14
