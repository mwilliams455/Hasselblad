name: Hasselblad Stage29 original MAIN CCM argument provenance

"on":
  push:
    branches:
      - recovery/awb-rebuild-20261021
    paths:
      - 'hasselblad_native_audit/isp_main_stage29/**'
      - '.github/workflows/hb-stage29-ccm-argflow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main-ccm-argument-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact research branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm Stage26 phone camera and native renderer untouched
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only a5c4409b60c40eb4b703395cc221fcf8e14816d1 HEAD -- HasselbladPhoton)"
          python3 -m py_compile hasselblad_native_audit/isp_main_stage29/inspect_ccm_argflow29.py
      - name: Self-test path joins, call clobbers and unreachable code
        shell: bash
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/isp_main_stage29/inspect_ccm_argflow29.py             --self-test --output "$RUNNER_TEMP/STAGE29_SYNTHETIC.json"
          python3 - "$RUNNER_TEMP/STAGE29_SYNTHETIC.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['status']=='PASS_synthetic' and d['invariant_cases']==8
          assert d['vendor_firmware_loaded'] is False
          assert d['hardware_pixel_equation_recovered'] is False
          assert d['photo_renderer_changed'] is False
          PY
      - name: Install pinned inert firmware extraction and ELF-analysis tools
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check             'cryptography>=42,<47' 'brotli>=1.1,<2' 'dissect.extfs>=3,<4'             'pyelftools>=0.31,<1' 'capstone>=5,<6'
      - name: Download official X2D II 1.3.16.2 source into transient CI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hasselblad_native_audit/firmware
          firmware=hasselblad_native_audit/firmware/X2DII_100C_v1_3_16_2.cim
          curl --fail --location --retry 2 --retry-delay 4 --connect-timeout 25 --max-time 520             --silent --show-error             'https://cdn.hasselblad.com/firmware/X2D_II_100C_Firmware/1.3.16.2/X2DII_100C_v1_3_16_2(1).cim'             --output "$firmware"
          test "$(stat -c %s "$firmware")" -eq 364814336
          echo '9789d6a9843d388034bc12341ad9a97585c25cb98cf11a0da8b768399b4842f6  '"$firmware" | sha256sum -c -
      - name: Extract source as inert data
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/extract_official.py > "$RUNNER_TEMP/STAGE29_PRIVATE_EXTRACTION.log"
      - name: Analyze original B2R CCM FN0 ABI reaching definitions
        shell: bash
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/isp_main_stage29/inspect_ccm_argflow29.py             --module hasselblad_native_audit/firmware/extracted/system/lib/modules/vcam_driver.ko             --output "$RUNNER_TEMP/STAGE29_CCM_ARGFLOW.json"
          python3 - "$RUNNER_TEMP/STAGE29_CCM_ARGFLOW.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['status']=='PASS_hash_pinned_static_argument_reaching_definitions'
          assert d['B2R_to_CCM_callsite_verified'] is True
          assert d['CCM_to_fn0_callsite_verified'] is True
          assert d['original_vendor_instruction_bytes_exported'] is False
          assert d['vendor_IQ_array_data_exported'] is False
          assert d['CCM_six_coefficient_pixel_equation_proven'] is False
          assert d['CCM_16bit_field_semantics_proven'] is False
          assert d['photographic_HNCS_authorized'] is False
          assert d['Android_Photon_renderer_modified'] is False
          a=d['B2R_related_format_callsite_argflow']['ccm_set_fmt']
          assert a['callsite_section_offset']=='0x6d598'
          assert sorted(a['candidate_ABI_argument_registers'])==['x0','x1','x2','x3']
          assert 'common_record_pointer_x19_last_writers' in a
          b=d['CCM_format_to_fn0_argflow']['ccm_set_fn0_config']
          assert b['callsite_section_offset']=='0x314f0'
          print(json.dumps({'status':'PASS_stage29_original_argument_scope',
                'format_calls':sorted(d['B2R_related_format_callsite_argflow']),
                'CCM_unique_last_writer_candidate_registers':
                    [k for k,v in a['candidate_ABI_argument_registers'].items()
                     if v['unique_reaching_writer_in_static_CFG']],
                'photographic_HNCS_authorized':False}))
          PY
      - name: Guard published metadata and remove original firmware
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/STAGE29_CCM_ARGFLOW.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          forbidden_keys={'instruction_hex','vendor_instruction_bytes',
                          'source_tuning_coefficients','raw_photo_pixels',
                          'original_lut_values','coefficient_array',
                          'original_firmware_blob'}
          def audit(node):
              if isinstance(node,dict):
                  for key,value in node.items():
                      assert key not in forbidden_keys,key
                      if key.endswith('_exported'):
                          assert value is False,key
                      audit(value)
              elif isinstance(node,list):
                  for item in node:audit(item)
              elif isinstance(node,str):
                  assert len(node)<1024,'unexpected_large_embedded_payload'
          audit(d)
          assert d['no_live_register_or_camera_pixel_samples'] is True
          assert d['original_vendor_instruction_bytes_exported'] is False
          assert d['vendor_IQ_array_data_exported'] is False
          PY
          rm -f hasselblad_native_audit/firmware/X2DII_100C_v1_3_16_2.cim
          rm -rf hasselblad_native_audit/firmware/extracted
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Upload sanitized source-only and synthetic evidence
        uses: actions/upload-artifact@v4
        with:
          name: Hasselblad-Stage29-CCM-Argument-Provenance-Safe
          path: |
            ${{ runner.temp }}/STAGE29_CCM_ARGFLOW.json
            ${{ runner.temp }}/STAGE29_SYNTHETIC.json
          if-no-files-found: error
          retention-days: 14
