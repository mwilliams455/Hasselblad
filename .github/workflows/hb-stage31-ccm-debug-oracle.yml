name: Hasselblad Stage31 original Eagle2 CCM debug-visibility audit

"on":
  push:
    branches:
      - recovery/awb-rebuild-20261021
    paths:
      - 'hasselblad_native_audit/isp_main_stage31/**'
      - '.github/workflows/hb-stage31-ccm-debug-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-ccm-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout recovery research only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify no Android photo renderer or app modifications
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only 7e9856287e5682d7bd34c49f66b2003e0403c087 HEAD -- HasselbladPhoton)"
          python3 -m py_compile hasselblad_native_audit/isp_main_stage31/inspect_ccm_debug31.py
      - name: Validate synthetic register-memory classification and no-oracle guards
        shell: bash
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/isp_main_stage31/inspect_ccm_debug31.py \
            --self-test --output "$RUNNER_TEMP/STAGE31_SYNTHETIC.json"
          python3 - "$RUNNER_TEMP/STAGE31_SYNTHETIC.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['status']=='PASS_synthetic' and d['checks']==8
          assert d['pixel_oracle_proven'] is False and d['phone_renderer_modified'] is False
          PY
      - name: Install inert firmware parser and AArch64 disassembler
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            'cryptography>=42,<47' 'brotli>=1.1,<2' 'dissect.extfs>=3,<4' \
            'pyelftools>=0.31,<1' 'capstone>=5,<6'
      - name: Fetch hash-pinned official X2D II 1.3.16.2 transiently
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hasselblad_native_audit/firmware
          firmware=hasselblad_native_audit/firmware/X2DII_100C_v1_3_16_2.cim
          curl --fail --location --retry 2 --retry-delay 4 --connect-timeout 25 --max-time 520 \
            --silent --show-error \
            'https://cdn.hasselblad.com/firmware/X2D_II_100C_Firmware/1.3.16.2/X2DII_100C_v1_3_16_2(1).cim' \
            --output "$firmware"
          test "$(stat -c %s "$firmware")" -eq 364814336
          echo '9789d6a9843d388034bc12341ad9a97585c25cb98cf11a0da8b768399b4842f6  '"$firmware" | sha256sum -c -
      - name: Extract original ELF without executing it
        shell: bash
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/extract_official.py > "$RUNNER_TEMP/STAGE31_PRIVATE_EXTRACTION.log"
      - name: Inventory exact CCM debug registers and mux functions
        shell: bash
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/isp_main_stage31/inspect_ccm_debug31.py \
            --module hasselblad_native_audit/firmware/extracted/system/lib/modules/vcam_driver.ko \
            --output "$RUNNER_TEMP/STAGE31_CCM_DEBUG.json"
          python3 - "$RUNNER_TEMP/STAGE31_CCM_DEBUG.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['status']=='PASS_exact_driver_debug_accessor_inventory'
          assert d['total_functions_checked']==14
          assert d['debug_accessor_count']==12
          assert d['six_coefficient_pixel_equation_recovered'] is False
          assert d['proven_pixel_input_RGB_readback'] is False
          assert d['proven_pixel_output_RGB_readback'] is False
          assert d['hardware_debug_mux_semantics_recovered'] is False
          assert d['Android_saved_photo_renderer_modified'] is False
          assert d['vendor_instruction_bytes_exported'] is False
          assert d['vendor_coefficients_exported'] is False
          assert d['vendor_firmware_uploaded'] is False
          print(json.dumps({'status':d['status'],
                            'functions':d['total_functions_checked'],
                            'decoded_instructions':d['total_decoded_instructions'],
                            'selected_debug_functions':[
                              {k:{'bytes':d['functions'][k]['function_bytes'],
                                  'memory_operations':d['functions'][k]['raw_load_store_operand_count'],
                                  'register_relative_offsets':[
                                    p['signed_register_relative_offset']
                                    for p in d['functions'][k]['load_store_records']]}}
                                for k in ('ccm_get_dbg_info_by_mux','ccm_set_dbg_mux')],
                            'pixel_oracle_proven':False}))
          PY
      - name: Remove original firmware and check privacy of output
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/STAGE31_CCM_DEBUG.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['vendor_instruction_bytes_exported'] is False
          assert d['vendor_coefficients_exported'] is False
          assert d['vendor_firmware_uploaded'] is False
          assert d['six_coefficient_pixel_equation_recovered'] is False
          for f in d['functions'].values():
              assert f['actual_image_samples_or_pixel_math_proven'] is False
              assert f['physical_register_meanings_proven'] is False
              for mem in f['load_store_records']:
                  assert mem['physical_MMIO_offset_proven'] is False
          PY
          rm -f hasselblad_native_audit/firmware/X2DII_100C_v1_3_16_2.cim
          rm -rf hasselblad_native_audit/firmware/extracted
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Publish only sanitized analysis metadata
        uses: actions/upload-artifact@v4
        with:
          name: Hasselblad-Stage31-CCM-Debug-Oracle-Safe
          path: |
            ${{ runner.temp }}/STAGE31_CCM_DEBUG.json
            ${{ runner.temp }}/STAGE31_SYNTHETIC.json
          if-no-files-found: error
          retention-days: 14
