name: Hasselblad Stage38 original ISP pixel oracle interface audit

"on":
  push:
    branches:
      - recovery/awb-rebuild-20261021
    paths:
      - 'hasselblad_native_audit/isp_main_stage38/**'
      - '.github/workflows/hb-stage38-original-pixel-oracle-surfaces.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage38-original-oracle-interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout recovery research only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify source scope and synthetic invariants
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only dda5d250a29f2716acba8fdf878b0b990f267cba HEAD -- HasselbladPhoton)"
          test "$(git rev-parse refs/remotes/origin/main)" = 929f523aa02ae5b224be39b9c36cce5975691a10
          python3 -m py_compile hasselblad_native_audit/isp_main_stage38/inspect_original_pixel_oracle_surfaces38.py
          python3 -m py_compile hasselblad_native_audit/isp_main_stage38/inspect_original_pixel_oracle_calls38b.py
          python3 -m py_compile hasselblad_native_audit/isp_main_stage38/inspect_dump_cross_importers38c.py
          python3 hasselblad_native_audit/isp_main_stage38/inspect_original_pixel_oracle_surfaces38.py \
            --self-test --output "$RUNNER_TEMP/STAGE38_SYNTHETIC.json"
          python3 - "$RUNNER_TEMP/STAGE38_SYNTHETIC.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['status']=='PASS_synthetic' and x['cases']==22
          assert x['original_firmware_loaded'] is False
          assert x['original_isp_pixel_oracle_found'] is False
          assert x['photographic_renderer_changed'] is False
          PY
          python3 hasselblad_native_audit/isp_main_stage38/inspect_original_pixel_oracle_calls38b.py \
            --self-test --output "$RUNNER_TEMP/STAGE38B_SYNTHETIC.json"
          python3 - "$RUNNER_TEMP/STAGE38B_SYNTHETIC.json" <<'PY_B'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['status']=='PASS_synthetic' and d['checks']==13
          assert d['firmware_loaded'] is False and d['pixel_oracle_proven'] is False
          PY_B
          python3 hasselblad_native_audit/isp_main_stage38/inspect_dump_cross_importers38c.py \
            --self-test --output "$RUNNER_TEMP/STAGE38C_SYNTHETIC.json"
          python3 - "$RUNNER_TEMP/STAGE38C_SYNTHETIC.json" <<'PY_C'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['status']=='PASS_synthetic' and d['checks']==8
          assert d['firmware_used'] is False and d['original_ccm_pixel_oracle_proven'] is False
          PY_C
      - name: Install inert ELF and firmware extraction dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            'cryptography>=42,<47' 'brotli>=1.1,<2' 'dissect.extfs>=3,<4' \
            'pyelftools>=0.31,<1' 'capstone>=5,<6'
      - name: Fetch exact official X2D II 1.3.16.2 only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hasselblad_native_audit/firmware
          p=hasselblad_native_audit/firmware/X2DII_100C_v1_3_16_2.cim
          curl --fail --location --retry 2 --retry-delay 4 --connect-timeout 25 --max-time 520 \
            --silent --show-error \
            'https://cdn.hasselblad.com/firmware/X2D_II_100C_Firmware/1.3.16.2/X2DII_100C_v1_3_16_2(1).cim' \
            --output "$p"
          test "$(stat -c %s "$p")" -eq 364814336
          echo '9789d6a9843d388034bc12341ad9a97585c25cb98cf11a0da8b768399b4842f6  '"$p" | sha256sum -c -
      - name: Read-only extract original firmware
        shell: bash
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/extract_official.py > "$RUNNER_TEMP/STAGE38_PRIVATE_EXTRACTION.log"
      - name: Bounded original ELF pixel-oracle surface audit
        shell: bash
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/isp_main_stage38/inspect_original_pixel_oracle_surfaces38.py \
            --firmware-root hasselblad_native_audit/firmware/extracted \
            --output "$RUNNER_TEMP/STAGE38_ORIGINAL_ISP_ORACLE_SURFACES.json"
          python3 - "$RUNNER_TEMP/STAGE38_ORIGINAL_ISP_ORACLE_SURFACES.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['status']=='PASS_exact_original_elf_symbol_and_bounded_string_inventory'
          assert len(d['source_files'])==6
          assert d['original_six_coefficient_pixel_equation_proven'] is False
          assert d['actual_isolated_MAIN_CCM_before_after_pixel_oracle'] is False
          assert d['vendor_original_ELF_data_or_instructions_exported'] is False
          assert d['private_images_or_sensor_calibration_exported'] is False
          assert d['phone_photo_pipeline_unchanged'] is True
          for path,src in d['source_files'].items():
              assert src['sha256'] and src['total_distinct_named_defined_functions'] > 0
              assert src['pixel_buffer_argument_dataflow_verified'] is False
              assert src['original_isp_input_or_output_pixels_captured'] is False
              print(json.dumps({'source':path,
                  'potential_pixel_readout_names':src['candidate_categories_total'].get('potential_frame_readout_name',0),
                  'potential_test_input_names':src['candidate_categories_total'].get('potential_synthetic_input_name',0),
                  'string_anchor_counts':src['bounded_string_signals']},sort_keys=True))
          PY
      - name: Trace 19 original-frame readout and injection functions
        shell: bash
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/isp_main_stage38/inspect_original_pixel_oracle_calls38b.py \
            --firmware-root hasselblad_native_audit/firmware/extracted \
            --output "$RUNNER_TEMP/STAGE38B_ORIGINAL_ORACLE_CALLS.json"
          python3 - "$RUNNER_TEMP/STAGE38B_ORIGINAL_ORACLE_CALLS.json" <<'PY_B'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['status']=='PASS_original_static_named_callee_caller_audit'
          assert len(d['source_reports'])==4
          assert sum(len(f['routines']) for f in d['source_reports'].values())==19
          assert d['same_stage_pre_post_ccm_RGB_pixels_demonstrated'] is False
          assert d['original_six_coefficient_ccm_pixel_arithmetic_recovered'] is False
          assert d['vendor_code_instruction_bytes_or_private_tuning_exported'] is False
          assert d['saved_photographs_or_production_branch_modified'] is False
          for src,entry in d['source_reports'].items():
              assert entry['sha256'] and entry['original_image_or_frame_data_processed_by_this_audit'] is False
              for name,fn in entry['routines'].items():
                  assert fn['decoded_instructions'] > 0
                  assert fn['actual_image_buffer_abi_proven'] is False
                  assert fn['original_ccm_isolated_pixel_readback_proven'] is False
                  assert fn['reverse_direct_callers']['actual_runtime_called_or_pixel_domain_proven'] is False
          print(json.dumps({'status':d['status'],
                'interesting_sources':{src:{name:{'calls':fn['static_direct_call_count'],
                     'callers':fn['reverse_direct_callers']['direct_call_candidate_count']}
                     for name,fn in entry['routines'].items()}
                     for src,entry in d['source_reports'].items()}},sort_keys=True))
          PY_B
      - name: Resolve original cross-library direct callers of frame-file exporters
        shell: bash
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/isp_main_stage38/inspect_dump_cross_importers38c.py \
            --firmware-root hasselblad_native_audit/firmware/extracted \
            --output "$RUNNER_TEMP/STAGE38C_CROSS_IMPORT_CALLS.json"
          python3 - "$RUNNER_TEMP/STAGE38C_CROSS_IMPORT_CALLS.json" <<'PY_C'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['status']=='PASS_exact_original_ELF_cross_importers'
          assert len(d['original_importer_sources'])==3
          assert d['isolated_original_ccm_before_after_samples_proven'] is False
          assert d['main_ccm_pixel_equation_proven'] is False
          assert d['dsp_or_camera_hardware_executed'] is False
          assert d['original_vendor_codes_or_tuning_or_pixels_exported'] is False
          assert d['photo_renderer_main_branch_unchanged'] is True
          assert d['original_importer_sources']['system/lib64/libdcam_pp.so']['plt_ordinal_mapping_validated'] is True
          for src,x in d['original_importer_sources'].items():
              assert x['source_sha256']
              if x['plt_ordinal_mapping_validated']:
                  assert len(x['dump_imports'])==4
                  for name,v in x['dump_imports'].items():
                      assert v['name_only_same_stage_ccm_proof'] is False
              else:
                  assert x['dump_imports'] is None
          print(json.dumps({'status':d['status'],
                  'direct_exporter_calls_by_importer':{src:{name:v['direct_callsite_count']
                      for name,v in x['dump_imports'].items()}
                      for src,x in d['original_importer_sources'].items() if x['dump_imports'] is not None}},sort_keys=True))
          PY_C
      - name: Remove original firmware regardless of inspection status
        if: always()
        shell: bash
        run: |
          rm -f hasselblad_native_audit/firmware/X2DII_100C_v1_3_16_2.cim
          rm -rf hasselblad_native_audit/firmware/extracted
      - name: Publish sanitized audit JSON only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Hasselblad-Stage38-Original-ISP-Oracle-Interfaces-Safe
          path: |
            ${{ runner.temp }}/STAGE38_SYNTHETIC.json
            ${{ runner.temp }}/STAGE38B_SYNTHETIC.json
            ${{ runner.temp }}/STAGE38C_SYNTHETIC.json
            ${{ runner.temp }}/STAGE38_ORIGINAL_ISP_ORACLE_SURFACES.json
            ${{ runner.temp }}/STAGE38B_ORIGINAL_ORACLE_CALLS.json
            ${{ runner.temp }}/STAGE38C_CROSS_IMPORT_CALLS.json
          if-no-files-found: error
          retention-days: 14