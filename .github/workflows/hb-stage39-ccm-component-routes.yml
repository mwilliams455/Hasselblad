name: Hasselblad Stage39 original Eagle2 CCM hardware interface audit

"on":
  push:
    branches:
      - recovery/awb-rebuild-20261021
    paths:
      - 'hasselblad_native_audit/isp_main_stage39/**'
      - '.github/workflows/hb-stage39-ccm-component-routes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage39-original-ccm-component:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify unchanged photo renderer and synthetic guard
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only dda5d250a29f2716acba8fdf878b0b990f267cba HEAD -- HasselbladPhoton)"
          test "$(git rev-parse refs/remotes/origin/main)" = 929f523aa02ae5b224be39b9c36cce5975691a10
          python3 -m py_compile hasselblad_native_audit/isp_main_stage39/inspect_ccm_component_routes39.py
          python3 hasselblad_native_audit/isp_main_stage39/inspect_ccm_component_routes39.py \
            --self-test --output "$RUNNER_TEMP/STAGE39_SYNTHETIC.json"
          python3 - "$RUNNER_TEMP/STAGE39_SYNTHETIC.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['status']=='PASS_synthetic' and d['checks']==14
          assert d['original_firmware_used'] is False
          assert d['pixel_oracle_proven'] is False
          assert d['photo_renderer_modified'] is False
          PY
      - name: Install read-only original firmware parsers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            'cryptography>=42,<47' 'brotli>=1.1,<2' 'dissect.extfs>=3,<4' \
            'pyelftools>=0.31,<1' 'capstone>=5,<6'
      - name: Fetch exact X2D II original firmware transiently
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hasselblad_native_audit/firmware
          file=hasselblad_native_audit/firmware/X2DII_100C_v1_3_16_2.cim
          curl --fail --location --retry 2 --retry-delay 4 --connect-timeout 25 --max-time 520 \
            --silent --show-error \
            'https://cdn.hasselblad.com/firmware/X2D_II_100C_Firmware/1.3.16.2/X2DII_100C_v1_3_16_2(1).cim' \
            --output "$file"
          test "$(stat -c %s "$file")" -eq 364814336
          echo '9789d6a9843d388034bc12341ad9a97585c25cb98cf11a0da8b768399b4842f6  '"$file" | sha256sum -c -
      - name: Read-only original firmware extraction
        shell: bash
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/extract_official.py > "$RUNNER_TEMP/STAGE39_PRIVATE_EXTRACTION.log"
      - name: Audit Eagle2 CCM component hooks and buffer route clues
        shell: bash
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/isp_main_stage39/inspect_ccm_component_routes39.py \
            --module hasselblad_native_audit/firmware/extracted/system/lib/modules/vcam_driver.ko \
            --output "$RUNNER_TEMP/STAGE39_ORIGINAL_CCM_COMPONENT_ROUTES.json"
          python3 - "$RUNNER_TEMP/STAGE39_ORIGINAL_CCM_COMPONENT_ROUTES.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['status']=='PASS_exact_original_component_relocation_inventory'
          assert d['original_driver_sha256']=='29309a225f2dcd8327b6fdaca477425b2c21ba580daa83599c1ea8699b7e450e'
          assert d['component_function_count']>=5
          assert d['original_ccm_pixel_oracle_proven'] is False
          assert d['original_ccm_pixel_equation_proven'] is False
          assert d['live_original_camera_accessed'] is False
          assert d['original_isp_register_controls_modified'] is False
          assert d['original_vendor_function_bytes_or_calibration_exported'] is False
          assert d['photon_saved_photographs_or_main_modified'] is False
          assert d['selected_function_references']['ccm_probe']['defined'] is True
          for k,v in d['component_functions'].items():
            assert v.get('buffer_or_pixel_math_proven') is False or v.get('analyzed') is False
          print(json.dumps({'status':d['status'],
                'ccm_functions':d['component_function_count'],
                'callback_references':d['all_ccm_noncall_data_pointer_references'],
                'named_buffer_candidates':d['possible_buffer_related_ccm_names'],
                'candidate_callbacks':{k:v['noncall_relocation_count'] for k,v in d['selected_function_references'].items()},
                'pixel_oracle_proven':False},sort_keys=True))
          PY
      - name: Delete original vendor firmware even on failure
        if: always()
        shell: bash
        run: |
          rm -f hasselblad_native_audit/firmware/X2DII_100C_v1_3_16_2.cim
          rm -rf hasselblad_native_audit/firmware/extracted
      - name: Upload sanitized audit JSON only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Hasselblad-Stage39-Original-CCM-Component-Safe
          path: |
            ${{ runner.temp }}/STAGE39_SYNTHETIC.json
            ${{ runner.temp }}/STAGE39_ORIGINAL_CCM_COMPONENT_ROUTES.json
          if-no-files-found: error
          retention-days: 14