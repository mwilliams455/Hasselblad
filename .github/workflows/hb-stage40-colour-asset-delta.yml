name: Hasselblad Stage40 exact dual X2D II firmware colour asset comparison

"on":
  push:
    branches:
      - recovery/awb-rebuild-20261021
    paths:
      - 'hasselblad_native_audit/isp_firmware_stage40/**'
      - '.github/workflows/hb-stage40-colour-asset-delta.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dual-original-firmware-colour-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout recovery research only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify production is untouched and synthetic regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse refs/remotes/origin/main)" = 929f523aa02ae5b224be39b9c36cce5975691a10
          test -z "$(git diff --name-only dda5d250a29f2716acba8fdf878b0b990f267cba HEAD -- HasselbladPhoton)"
          python3 -m py_compile hasselblad_native_audit/isp_firmware_stage40/extract_exact40.py
          python3 -m py_compile hasselblad_native_audit/isp_firmware_stage40/compare_colour40.py
          python3 -m py_compile hasselblad_native_audit/isp_firmware_stage40/fingerprint_colour_functions40c.py
          python3 hasselblad_native_audit/isp_firmware_stage40/compare_colour40.py \
            --self-test --output "$RUNNER_TEMP/STAGE40_SYNTHETIC.json"
          python3 - "$RUNNER_TEMP/STAGE40_SYNTHETIC.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['status']=='PASS_synthetic' and d['checks']==15
          assert d['original_firmware_loaded'] is False
          assert d['photon_photo_render_unchanged'] is True
          PY
          python3 hasselblad_native_audit/isp_firmware_stage40/fingerprint_colour_functions40c.py \
            --self-test --output "$RUNNER_TEMP/STAGE40C_SYNTHETIC.json"
          python3 - "$RUNNER_TEMP/STAGE40C_SYNTHETIC.json" <<'PY_C'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['status']=='PASS_synthetic' and d['checks']==23
          assert d['vendor_assets_loaded'] is False
          assert d['original_photographic_pixel_parity_proven'] is False
          PY_C
      - name: Install inert exact-source extractor dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            'cryptography>=42,<47' 'brotli>=1.1,<2' 'dissect.extfs>=3,<4' \
            'pyelftools>=0.31,<1' 'capstone>=5,<6'
      - name: Download exact original 1.3.16.2 transiently
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hb40"
          p="$RUNNER_TEMP/hb40/X2DII_100C_v1_3_16_2.cim"
          curl --fail --location --retry 3 --retry-delay 4 --connect-timeout 30 --max-time 610 \
            --silent --show-error \
            'https://cdn.hasselblad.com/firmware/X2D_II_100C_Firmware/1.3.16.2/X2DII_100C_v1_3_16_2(1).cim' \
            --output "$p"
          test "$(stat -c %s "$p")" -eq 364814336
          echo '9789d6a9843d388034bc12341ad9a97585c25cb98cf11a0da8b768399b4842f6  '"$p" | sha256sum -c -
      - name: Extract and index old official colour inputs without publishing them
        shell: bash
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/hb40/X2DII_100C_v1_3_16_2.cim"
          python3 hasselblad_native_audit/isp_firmware_stage40/extract_exact40.py \
            --source "$p" --version 1.3.16.2 \
            --output "$RUNNER_TEMP/hb40/extracted-old" > "$RUNNER_TEMP/STAGE40_OLD_PRIVATE_EXTRACT.log"
          python3 hasselblad_native_audit/isp_firmware_stage40/compare_colour40.py \
            --snapshot "$RUNNER_TEMP/hb40/extracted-old" --version 1.3.16.2 \
            --output "$RUNNER_TEMP/STAGE40_OLD_PRIVATE_INDEX.json"
          python3 hasselblad_native_audit/isp_firmware_stage40/fingerprint_colour_functions40c.py \
            --root "$RUNNER_TEMP/hb40/extracted-old" \
            --source-snapshot "$RUNNER_TEMP/STAGE40_OLD_PRIVATE_INDEX.json" \
            --output "$RUNNER_TEMP/STAGE40_OLD_FUNCTIONS_PRIVATE.json"
          rm -rf "$RUNNER_TEMP/hb40/extracted-old"
          rm -f "$p"
      - name: Download new pinned 1.3.18.1 from official Hasselblad CDN
        shell: bash
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/hb40/X2DII_100C_v1_3_18_1.cim"
          curl --fail --location --retry 3 --retry-delay 4 --connect-timeout 30 --max-time 610 \
            --silent --show-error \
            'https://cdn.hasselblad.com/firmware/X2D_II_100C_Firmware/1.3.18.1/X2DII_100C_v1_3_18_1.cim' \
            --output "$p"
          test "$(stat -c %s "$p")" -eq 365283840
          echo 'c65970cbc1519f876aa3296411f8bb5075995dabc9479bb8abb635945dad6496  '"$p" | sha256sum -c -
      - name: Extract and index new official colour inputs without publishing them
        shell: bash
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/hb40/X2DII_100C_v1_3_18_1.cim"
          python3 hasselblad_native_audit/isp_firmware_stage40/extract_exact40.py \
            --source "$p" --version 1.3.18.1 \
            --output "$RUNNER_TEMP/hb40/extracted-new" > "$RUNNER_TEMP/STAGE40_NEW_PRIVATE_EXTRACT.log"
          python3 hasselblad_native_audit/isp_firmware_stage40/compare_colour40.py \
            --snapshot "$RUNNER_TEMP/hb40/extracted-new" --version 1.3.18.1 \
            --output "$RUNNER_TEMP/STAGE40_NEW_PRIVATE_INDEX.json"
          python3 hasselblad_native_audit/isp_firmware_stage40/fingerprint_colour_functions40c.py \
            --root "$RUNNER_TEMP/hb40/extracted-new" \
            --source-snapshot "$RUNNER_TEMP/STAGE40_NEW_PRIVATE_INDEX.json" \
            --output "$RUNNER_TEMP/STAGE40_NEW_FUNCTIONS_PRIVATE.json"
          rm -rf "$RUNNER_TEMP/hb40/extracted-new"
          rm -f "$p"
      - name: Compute sanitized original colour-source comparison
        shell: bash
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/isp_firmware_stage40/compare_colour40.py \
            --old "$RUNNER_TEMP/STAGE40_OLD_PRIVATE_INDEX.json" \
            --new "$RUNNER_TEMP/STAGE40_NEW_PRIVATE_INDEX.json" \
            --output "$RUNNER_TEMP/STAGE40_DUAL_ORIGINAL_COLOUR_COMPARISON_SAFE.json"
          python3 hasselblad_native_audit/isp_firmware_stage40/fingerprint_colour_functions40c.py \
            --old "$RUNNER_TEMP/STAGE40_OLD_FUNCTIONS_PRIVATE.json" \
            --new "$RUNNER_TEMP/STAGE40_NEW_FUNCTIONS_PRIVATE.json" \
            --output "$RUNNER_TEMP/STAGE40C_FUNCTION_BYTE_IDENTITY_SAFE.json"
          python3 - "$RUNNER_TEMP/STAGE40C_FUNCTION_BYTE_IDENTITY_SAFE.json" <<'PY_C'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['status']=='PASS_exact_original_dual_function_byte_identity'
          assert len(d['sources'])==4
          assert sum(d['selected_function_counts'].values())==27
          assert d['ccm_pixel_equation_proven'] is False
          assert d['main_gamma_or_lut_pixel_sampling_proven'] is False
          assert d['phone_saved_photo_renderer_modified'] is False
          assert d['vendor_function_bytes_or_numeric_tables_exported'] is False
          assert d['stage40d_PCREL_target_normalization_does_not_prove_callee_identity'] is True
          assert sum(d['stage40d_syntax_comparison_counts'][k] for k in ('identical_mnemonic_sequence','changed_mnemonic_sequence','shape_unavailable'))==27
          assert sum(d['stage40d_syntax_comparison_counts'][k] for k in ('identical_normalized_operand_shape','changed_normalized_operand_shape','shape_unavailable'))==27
          PY_C
          python3 - "$RUNNER_TEMP/STAGE40_DUAL_ORIGINAL_COLOUR_COMPARISON_SAFE.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['status']=='PASS_hash_pinned_original_dual_firmware_comparison'
          assert d['old_official_package_sha256']=='9789d6a9843d388034bc12341ad9a97585c25cb98cf11a0da8b768399b4842f6'
          assert d['new_official_package_sha256']=='c65970cbc1519f876aa3296411f8bb5075995dabc9479bb8abb635945dad6496'
          assert d['Android_app_modified'] is False and d['main_branch_modified'] is False
          assert d['original_vendor_numeric_arrays_or_images_exported'] is False
          assert d['hardware_CCM_pixel_equation_proven'] is False
          assert d['gamma_and_MAIN_LUT_pixel_sampling_proven'] is False
          assert len(d['selected_source_files'])>=15
          assert len(d['original_IQ_subtree_hash_equality'])>=8
          PY
      - name: Remove all private firmware bytes and unsanitized indexes
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/hb40"
          rm -f "$RUNNER_TEMP/STAGE40_OLD_PRIVATE_INDEX.json" "$RUNNER_TEMP/STAGE40_NEW_PRIVATE_INDEX.json"
          rm -f "$RUNNER_TEMP/STAGE40_OLD_FUNCTIONS_PRIVATE.json" "$RUNNER_TEMP/STAGE40_NEW_FUNCTIONS_PRIVATE.json"
          rm -f "$RUNNER_TEMP/STAGE40_OLD_PRIVATE_EXTRACT.log" "$RUNNER_TEMP/STAGE40_NEW_PRIVATE_EXTRACT.log"
      - name: Publish only safe derived comparison and synthetic receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Hasselblad-Stage40-Dual-Firmware-Colour-Safe
          path: |
            ${{ runner.temp }}/STAGE40_DUAL_ORIGINAL_COLOUR_COMPARISON_SAFE.json
            ${{ runner.temp }}/STAGE40_SYNTHETIC.json
            ${{ runner.temp }}/STAGE40C_FUNCTION_BYTE_IDENTITY_SAFE.json
            ${{ runner.temp }}/STAGE40C_SYNTHETIC.json
          if-no-files-found: error
          retention-days: 14