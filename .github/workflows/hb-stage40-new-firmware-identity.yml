name: Hasselblad Stage40 new X2D II official firmware identity

"on":
  push:
    branches:
      - recovery/awb-rebuild-20261021
    paths:
      - '.github/workflows/hb-stage40-new-firmware-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-firmware-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout research branch only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Guard production application and branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse refs/remotes/origin/main)" = 929f523aa02ae5b224be39b9c36cce5975691a10
          test -z "$(git diff --name-only dda5d250a29f2716acba8fdf878b0b990f267cba HEAD -- HasselbladPhoton)"
      - name: Compute SHA256 of exact new official release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hb40"
          p="$RUNNER_TEMP/hb40/X2DII_100C_v1_3_18_1.cim"
          curl --fail --location --retry 3 --retry-delay 3 --connect-timeout 30 --max-time 600 \
            --silent --show-error \
            'https://cdn.hasselblad.com/firmware/X2D_II_100C_Firmware/1.3.18.1/X2DII_100C_v1_3_18_1.cim' \
            --output "$p"
          test "$(stat -c %s "$p")" -eq 365283840
          python3 - "$p" "$RUNNER_TEMP/STAGE40_OFFICIAL_NEW_SOURCE_IDENTITY.json" <<'PY'
          from pathlib import Path
          import hashlib,json,sys
          file,out=map(Path,sys.argv[1:])
          with file.open('rb') as stream:
              digest=hashlib.file_digest(stream,'sha256').hexdigest()
          report={
              'schema':'hasselblad-stage40-official-new-package-identity-v1',
              'status':'PASS_official_download_length_and_hash_recorded',
              'model':'X2D II 100C',
              'firmware_version':'1.3.18.1',
              'download_origin':'official_hasselblad_cdn',
              'source_length_bytes':file.stat().st_size,
              'source_sha256':digest,
              'expected_sha256_pinned_before_this_run':False,
              'package_parsed_or_executed':False,
              'photographic_colour_or_CCM_unchanged_proven':False,
              'old_vs_new_diff_completed':False,
              'user_photos_or_original_payload_uploaded':False,
              'photon_saved_photo_renderer_modified':False
          }
          out.write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'status':report['status'],'bytes':report['source_length_bytes'],'sha256':digest}))
          PY
      - name: Delete downloaded firmware
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/hb40"
      - name: Upload identity receipt only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Hasselblad-Stage40-Official-Source-Identity-Safe
          path: ${{ runner.temp }}/STAGE40_OFFICIAL_NEW_SOURCE_IDENTITY.json
          if-no-files-found: error
          retention-days: 14
