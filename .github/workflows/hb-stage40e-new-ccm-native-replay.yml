name: Hasselblad Stage40E original new firmware CCM arithmetic replay
"on":
  push:
    branches: [recovery/awb-rebuild-20261021]
    paths:
      - 'hasselblad_native_audit/isp_firmware_stage40/replay_new_original_ccm40e.py'
      - '.github/workflows/hb-stage40e-new-ccm-native-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  new-original-ccm-arithmetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify branch and run no-vendor synthetic checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse refs/remotes/origin/main)" = 929f523aa02ae5b224be39b9c36cce5975691a10
          test -z "$(git diff --name-only dda5d250a29f2716acba8fdf878b0b990f267cba HEAD -- HasselbladPhoton)"
          git diff --quiet 929f523aa02ae5b224be39b9c36cce5975691a10 HEAD -- \
            hasselblad_native_audit/main_colour_20261019/ccm/ccm_prepare.c \
            hasselblad_native_audit/main_colour_20261019/ccm/ccm_prepare.h \
            hasselblad_native_audit/main_colour_20261019/ccm/ccm_prepare_probe.c
          python3 -m py_compile hasselblad_native_audit/isp_firmware_stage40/replay_new_original_ccm40e.py
          python3 hasselblad_native_audit/isp_firmware_stage40/replay_new_original_ccm40e.py \
            --self-test --output "$RUNNER_TEMP/STAGE40E_SYNTHETIC.json"
      - name: Install inert extraction/ELF tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            'cryptography>=42,<47' 'brotli>=1.1,<2' \
            'dissect.extfs>=3,<4' 'pyelftools>=0.31,<1'
      - name: Locate Android28 arm64 clang and QEMU
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          dirs=()
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ]; then dirs+=("$ANDROID_NDK_LATEST_HOME"); fi
          if [ -n "${ANDROID_NDK_HOME:-}" ]; then dirs+=("$ANDROID_NDK_HOME"); fi
          if [ -d "$sdk/ndk" ]; then
            while IFS= read -r d; do dirs+=("$d"); done < <(find "$sdk/ndk" -mindepth 1 -maxdepth 1 -type d | sort -rV)
          fi
          clang=''
          for d in "${dirs[@]}"; do
            p="$d/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"
            if [ -x "$p" ]; then clang="$p"; break; fi
          done
          if [ -z "$clang" ]; then
            sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
            test -x "$sdkmanager"
            yes | "$sdkmanager" --sdk_root="$sdk" 'ndk;27.2.12479018' > "$RUNNER_TEMP/STAGE40E_PRIVATE_NDK_INSTALL.log" || test -d "$sdk/ndk/27.2.12479018"
            clang="$sdk/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"
          fi
          test -x "$clang"
          qemu="$(command -v qemu-aarch64 || true)"
          if [ -z "$qemu" ]; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qemu-user > "$RUNNER_TEMP/STAGE40E_PRIVATE_QEMU_INSTALL.log"
            qemu="$(command -v qemu-aarch64 || true)"
          fi
          test -x "$qemu"
          echo "HB40E_CLANG=$clang" >> "$GITHUB_ENV"
          echo "HB40E_QEMU=$qemu" >> "$GITHUB_ENV"
      - name: Verify exact official 1.3.18.1 archive and run original CCM native arithmetic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hb40e"
          p="$RUNNER_TEMP/hb40e/X2DII_100C_v1_3_18_1.cim"
          curl --fail --location --retry 3 --retry-delay 4 --connect-timeout 30 --max-time 610 \
            --silent --show-error \
            'https://cdn.hasselblad.com/firmware/X2D_II_100C_Firmware/1.3.18.1/X2DII_100C_v1_3_18_1.cim' \
            --output "$p"
          test "$(stat -c %s "$p")" -eq 365283840
          echo 'c65970cbc1519f876aa3296411f8bb5075995dabc9479bb8abb635945dad6496  '"$p" | sha256sum -c -
          python3 hasselblad_native_audit/isp_firmware_stage40/extract_exact40.py \
            --source "$p" --version 1.3.18.1 \
            --output "$RUNNER_TEMP/hb40e/extracted" > "$RUNNER_TEMP/STAGE40E_PRIVATE_EXTRACT.log"
          python3 hasselblad_native_audit/isp_firmware_stage40/replay_new_original_ccm40e.py \
            --firmware-root "$RUNNER_TEMP/hb40e/extracted" \
            --clang "$HB40E_CLANG" --qemu "$HB40E_QEMU" \
            --output "$RUNNER_TEMP/STAGE40E_NATIVE_ARITHMETIC_SAFE.json"
          python3 - "$RUNNER_TEMP/STAGE40E_NATIVE_ARITHMETIC_SAFE.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['status']=='PASS_original_new_1_3_18_1_CCM_preparation_162_cases'
          assert d['total_cases']==162 and d['total_scalar_outputs_checked']==15552
          assert d['all_results_original_native_equal_portable_C_and_independent_Python'] is True
          assert d['Android_Bionic_original_library_executed_under_QEMU'] is True
          assert d['saved_image_colour_or_original_CCM_pixel_operator_proven'] is False
          assert d['original_vendor_instruction_or_tuning_values_or_images_exported'] is False
          assert d['photographic_renderer_modified'] is False and d['main_branch_modified'] is False
          PY
      - name: Delete all extracted vendor bytes and temporary inputs
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/hb40e"
          rm -f "$RUNNER_TEMP/STAGE40E_PRIVATE_EXTRACT.log" "$RUNNER_TEMP/STAGE40E_PRIVATE_NDK_INSTALL.log" "$RUNNER_TEMP/STAGE40E_PRIVATE_QEMU_INSTALL.log"
      - name: Publish only sanitized proof receipts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Hasselblad-Stage40E-New-Original-CCM-Arithmetic-Safe
          path: |
            ${{ runner.temp }}/STAGE40E_NATIVE_ARITHMETIC_SAFE.json
            ${{ runner.temp }}/STAGE40E_SYNTHETIC.json
          if-no-files-found: error
          retention-days: 14