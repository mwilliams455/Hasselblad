name: Hasselblad Stage41 exact original X2D II liveview hook provenance

"on":
  push:
    branches: [recovery/awb-rebuild-20261021]
    paths:
      - 'hasselblad_native_audit/isp_liveview_stage41/**'
      - '.github/workflows/hb-stage41-x-unleashed-liveview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  liveview-original-symbol-and-upstream-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout recovery branch only
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Source and production guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse refs/remotes/origin/main)" = 929f523aa02ae5b224be39b9c36cce5975691a10
          test -z "$(git diff --name-only dda5d250a29f2716acba8fdf878b0b990f267cba HEAD -- HasselbladPhoton)"
          python3 -m py_compile hasselblad_native_audit/isp_liveview_stage41/inspect_original_liveview41.py
          python3 -m py_compile hasselblad_native_audit/isp_liveview_stage41/inspect_original_liveview_xrefs41b.py
          python3 hasselblad_native_audit/isp_liveview_stage41/inspect_original_liveview_xrefs41b.py \
            --self-test --output "$RUNNER_TEMP/STAGE41B_SYNTHETIC.json"
          python3 - "$RUNNER_TEMP/STAGE41B_SYNTHETIC.json" <<'PY_B'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['status']=='PASS_synthetic' and d['checks']==12
          assert d['vendor_firmware_loaded'] is False and d['CCM_pixel_equation_proven'] is False
          PY_B
          python3 hasselblad_native_audit/isp_liveview_stage41/inspect_original_liveview41.py \
            --self-test --output "$RUNNER_TEMP/STAGE41_SYNTHETIC.json"
          python3 - "$RUNNER_TEMP/STAGE41_SYNTHETIC.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['status']=='PASS_synthetic' and d['checks']==14
          assert d['original_firmware_loaded'] is False
          assert d['pre_post_ccm_pixel_oracle_proven'] is False
          PY
      - name: Verify pinned original third-party host-only sources
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/stage41-public-source"
          mkdir -p "$d"
          base='https://raw.githubusercontent.com/scanfsec/hasselblad-x-unleashed/dd798e5e51a8bebc333ce7026c7fa700a0feb96c/hasselblad_monitor/uvc-gadget'
          for n in eagle2_v4l2_abi.h liveview_bridge.c liveview_frame.h test_liveview.c test_eagle2_abi.c; do
            curl --fail --location --silent --show-error --connect-timeout 25 --max-time 120 "$base/$n" --output "$d/$n"
          done
          (cd "$d" && git hash-object eagle2_v4l2_abi.h liveview_bridge.c liveview_frame.h test_liveview.c test_eagle2_abi.c) > "$RUNNER_TEMP/stage41_upstream_blob_ids.txt"
          cat > "$RUNNER_TEMP/stage41_expected_blob_ids.txt" <<'EOF'
          91b13ce7a02aeab247305be91aac25c492d4de6c
          1f3a63664ca140199e5cdeb84de1ed09a7b0f1f0
          91b9a8996194d461512418b89bf5ed29f6b800ac
          e81178c4b5d88a51b2d0dd3d114d7c3996c94c13
          6b4b03aae24f40f887ff76f403289912e7a858fa
          EOF
          diff -u "$RUNNER_TEMP/stage41_expected_blob_ids.txt" "$RUNNER_TEMP/stage41_upstream_blob_ids.txt"
          echo 'PASS independent third-party original sources pinned by exact Git blobs'
      - name: Execute independent published synthetic tests with mock IO
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/stage41-public-source"
          gcc -std=gnu11 -O2 -Wall -Wextra -I "$d" "$d/test_liveview.c" -o "$RUNNER_TEMP/test_liveview"
          gcc -std=gnu11 -O2 -Wall -Wextra -I "$d" "$d/test_eagle2_abi.c" -o "$RUNNER_TEMP/test_eagle2_abi"
          "$RUNNER_TEMP/test_liveview"
          "$RUNNER_TEMP/test_eagle2_abi"
          python3 - "$RUNNER_TEMP/STAGE41_UPSTREAM_SYNTHETIC.json" <<'PY'
          import json,sys
          from pathlib import Path
          obj={'status':'PASS_pinned_third_party_host_synthetic',
               'third_party_commit':'dd798e5e51a8bebc333ce7026c7fa700a0feb96c',
               'source_git_blob_ids_match':True,
               'tests':['test_liveview.c','test_eagle2_abi.c'],
               'synthetic_test_programs_executed':2,
               'original_hasselblad_camera_code_executed':False,
               'camera_hardware_accessed':False,
               'original_ccm_before_after_samples_obtained':False}
          Path(sys.argv[1]).write_text(json.dumps(obj,sort_keys=True,indent=2)+'\n')
          print(json.dumps(obj,sort_keys=True))
          PY
      - name: Install inert exact-original ELF/extraction dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            'cryptography>=42,<47' 'brotli>=1.1,<2' 'dissect.extfs>=3,<4' 'pyelftools>=0.31,<1' 'capstone>=5,<6'
      - name: Download only exact official 1.3.16.2 transiently
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hasselblad_native_audit/firmware
          p=hasselblad_native_audit/firmware/X2DII_100C_v1_3_16_2.cim
          curl --fail --location --silent --show-error --retry 3 --retry-delay 3 --connect-timeout 30 --max-time 600 \
            'https://cdn.hasselblad.com/firmware/X2D_II_100C_Firmware/1.3.16.2/X2DII_100C_v1_3_16_2(1).cim' \
            --output "$p"
          test "$(stat -c %s "$p")" -eq 364814336
          echo '9789d6a9843d388034bc12341ad9a97585c25cb98cf11a0da8b768399b4842f6  '"$p" | sha256sum -c -
      - name: Extract and search original camera firmware without executing vendor code
        shell: bash
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/extract_official.py > "$RUNNER_TEMP/STAGE41_PRIVATE_EXTRACT.log"
          python3 hasselblad_native_audit/isp_liveview_stage41/inspect_original_liveview41.py \
            --firmware-root hasselblad_native_audit/firmware/extracted \
            --output "$RUNNER_TEMP/STAGE41_ORIGINAL_LIVEVIEW_INTERFACE_SAFE.json"
          python3 - "$RUNNER_TEMP/STAGE41_ORIGINAL_LIVEVIEW_INTERFACE_SAFE.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['status']=='PASS_original_1_3_16_2_liveview_surface_inventory'
          assert d['x_unleashed_kheaders_module_sha256_matches'] is True
          assert d['aarch64_elf_files_examined']>100
          assert d['original_liveview_hook_runtime_entry_proven'] is False
          assert d['MAIN_CCM_pre_post_pixel_stage_exposed'] is False
          assert d['original_main_colour_equation_proven'] is False
          assert d['original_vendor_code_or_tuning_exported'] is False
          assert d['private_frames_or_camera_identifiers_exported'] is False
          print(json.dumps({'status':d['status'],
              'native_ELF_count':d['aarch64_elf_files_examined'],
              'exact_label_files':d['exact_liveview_after_sbpc_literal_found_in'],
              'related_files_count':d['related_files_count'],
              'original_CCM_oracle_proven':False},sort_keys=True))
          PY
      - name: Resolve exact original camera-service SBPC literal and AIO call graph
        shell: bash
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/isp_liveview_stage41/inspect_original_liveview_xrefs41b.py \
            --firmware-root hasselblad_native_audit/firmware/extracted \
            --output "$RUNNER_TEMP/STAGE41B_ORIGINAL_SBPC_XREFS_SAFE.json"
          python3 - "$RUNNER_TEMP/STAGE41B_ORIGINAL_SBPC_XREFS_SAFE.json" <<'PY_B'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['status']=='PASS_pinned_original_camera_service_and_AIO_static_xref_audit'
          assert len(d['source_reports'])==2
          assert all(x['sha256'] and x['total_named_function_symbols_examined']>0 for x in d['source_reports'].values())
          assert d['same_frame_before_after_MAIN_CCM_proven'] is False
          assert d['CCM_pixel_equation_proven'] is False
          assert d['original_vendor_instruction_bytes_exported'] is False
          assert d['private_camera_images_or_calibration_exported'] is False
          assert d['phone_app_main_or_saved_photos_modified'] is False
          print(json.dumps({'status':d['status'],'anchor_refs':{
              key:len(value['anchor_code_reference_scan']['literal_address_references'])
              for key,value in d['source_reports'].items()},
              'ccm_oracle_proven':False},sort_keys=True))
          PY_B
      - name: Remove vendor firmware and upstream source even on error
        if: always()
        shell: bash
        run: |
          rm -f hasselblad_native_audit/firmware/X2DII_100C_v1_3_16_2.cim
          rm -rf hasselblad_native_audit/firmware/extracted
          rm -rf "$RUNNER_TEMP/stage41-public-source"
          rm -f "$RUNNER_TEMP/test_liveview" "$RUNNER_TEMP/test_eagle2_abi"
          rm -f "$RUNNER_TEMP/STAGE41_PRIVATE_EXTRACT.log"
      - name: Publish only bounded JSON receipts (no vendor bytes)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Hasselblad-Stage41-XUnleashed-Original-Liveview-Safe
          path: |
            ${{ runner.temp }}/STAGE41_SYNTHETIC.json
            ${{ runner.temp }}/STAGE41B_SYNTHETIC.json
            ${{ runner.temp }}/STAGE41_UPSTREAM_SYNTHETIC.json
            ${{ runner.temp }}/STAGE41_ORIGINAL_LIVEVIEW_INTERFACE_SAFE.json
            ${{ runner.temp }}/STAGE41B_ORIGINAL_SBPC_XREFS_SAFE.json
          if-no-files-found: error
          retention-days: 14