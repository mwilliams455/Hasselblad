name: Hasselblad Stage41F exact original SBPC table ownership

"on":
  push:
    branches: [recovery/awb-rebuild-20261021]
    paths:
      - 'hasselblad_native_audit/isp_liveview_stage41f/**'
      - '.github/workflows/hb-stage41f-table-ownership.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  narrow-original-table-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve production and phone renderer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse refs/remotes/origin/main)" = 929f523aa02ae5b224be39b9c36cce5975691a10
          test -z "$(git diff --name-only dbc6110e16579c041c11e00da0e81ba927a81e99 HEAD -- HasselbladPhoton)"
          python3 -m py_compile hasselblad_native_audit/isp_liveview_stage41f/inspect_original_sbpc_table41f.py
      - name: Install inert audit dependencies
        run: python3 -m pip install --disable-pip-version-check 'cryptography>=42,<47' 'brotli>=1.1,<2' 'dissect.extfs>=3,<4' 'pyelftools>=0.31,<1' 'capstone>=5,<6'
      - name: Test stale-register regression and symbol boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/isp_liveview_stage41f/inspect_original_sbpc_table41f.py \
            --self-test --output "$RUNNER_TEMP/STAGE41F_SYNTHETIC.json"
      - name: Download hash-pinned original firmware as transient data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hasselblad_native_audit/firmware
          p=hasselblad_native_audit/firmware/X2DII_100C_v1_3_16_2.cim
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 30 --max-time 600 \
            'https://cdn.hasselblad.com/firmware/X2D_II_100C_Firmware/1.3.16.2/X2DII_100C_v1_3_16_2(1).cim' --output "$p"
          test "$(stat -c %s "$p")" -eq 364814336
          echo '9789d6a9843d388034bc12341ad9a97585c25cb98cf11a0da8b768399b4842f6  '"$p" | sha256sum -c -
      - name: Extract inert data and resolve only Stage41E table lead
        shell: bash
        run: |
          set -euo pipefail
          python3 hasselblad_native_audit/extract_official.py > "$RUNNER_TEMP/STAGE41F_PRIVATE_EXTRACT.log"
          python3 hasselblad_native_audit/isp_liveview_stage41f/inspect_original_sbpc_table41f.py \
            --firmware-root hasselblad_native_audit/firmware/extracted \
            --output "$RUNNER_TEMP/STAGE41F_ORIGINAL_TABLE_SAFE.json"
          python3 - "$RUNNER_TEMP/STAGE41F_ORIGINAL_TABLE_SAFE.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['status']=='PASS_exact_original_table_ownership_audit'
          assert len(d['executable_neighbors'])==5
          assert d['original_camera_or_DSP_executed'] is False
          assert d['vendor_bytes_or_raw_strings_exported'] is False
          assert d['Photon_photo_renderer_modified'] is False
          assert d['MAIN_CCM_pixel_oracle_proven'] is False
          PY
      - name: Remove all firmware before artifact publication
        if: always()
        shell: bash
        run: |
          rm -f hasselblad_native_audit/firmware/X2DII_100C_v1_3_16_2.cim
          rm -rf hasselblad_native_audit/firmware/extracted
          rm -f "$RUNNER_TEMP/STAGE41F_PRIVATE_EXTRACT.log"
      - name: Publish only bounded symbol and relocation metadata
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Hasselblad-Stage41F-Original-Table-Safe
          path: |
            ${{ runner.temp }}/STAGE41F_SYNTHETIC.json
            ${{ runner.temp }}/STAGE41F_ORIGINAL_TABLE_SAFE.json
          if-no-files-found: error
          retention-days: 14
